  fact: Trong các mô hình dự báo như Winters, các hằng số làm mượt (smoothing constants) luôn phải nằm trong khoảng từ 0 đến 1.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 892–895
- id: n3072970863
  app: excel
  topic: Tham số Type trong hàm tài chính
  fact: 'Tham số ''type'' trong các hàm như PV, FV, PMT xác định thời điểm thanh toán: nhập 0 (hoặc bỏ trống) nếu thanh toán cuối kỳ, nhập 1 nếu
    thanh toán đầu kỳ.'
  sources:
  - Bai tap Tin hoc FTU2.pdf, trang 70–72
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 123–127
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 128–130
- id: n3076068233
  app: excel
  topic: Thao tác với biểu đồ
  fact: Bạn có thể di chuyển hoặc thay đổi kích thước biểu đồ bằng cách nhấp chuột vào vùng biểu đồ và kéo thả các điểm neo (markers) xuất hiện
    xung quanh.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 67–75
- id: n3074922859
  app: excel
  topic: Thay đổi bố cục PivotTable
  fact: Dễ dàng thay đổi cách nhìn dữ liệu bằng cách kéo thả các trường giữa các khu vực Rows, Columns, và Values trong bảng PivotTable Fields.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 541–546
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 594–598
- id: n3076067162
  app: excel
  topic: Thay đổi kích thước biểu đồ
  fact: Sử dụng các nút điều khiển (markers) ở góc biểu đồ để thay đổi kích thước mà vẫn giữ nguyên tỷ lệ khung hình, hoặc dùng các nút ở cạnh
    để thay đổi chiều rộng/cao riêng biệt.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 60–66
- id: n3074977936
  app: excel
  topic: Thay đổi màu biểu đồ
  fact: Bạn có thể thay đổi màu sắc của các chuỗi dữ liệu trong biểu đồ bằng cách chọn chuỗi đó, nhấn nút Chart Styles (biểu tượng cây cọ) và
    chọn tab Color để đổi chủ đề màu.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 664–668
- id: n3076097932
  app: excel
  topic: Thay đổi thư mục lưu mặc định
  fact: Bạn có thể thay đổi vị trí lưu mặc định cho các cơ sở dữ liệu mới bằng cách vào File > Options > General và chỉnh sửa mục Default Database
    Folder.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 176–180
- id: n3075138465
  app: excel
  topic: Thẻ Developer
  fact: Thẻ Developer không hiển thị mặc định trên thanh ribbon, bạn cần vào cài đặt tùy chỉnh ribbon để kích hoạt nó trước khi sử dụng các tính
    năng lập trình.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 1056–1059
- id: n3074960908
  app: excel
  topic: Thêm nhãn dữ liệu nhanh
  fact: Bạn có thể thêm nhãn dữ liệu nhanh chóng bằng cách bấm vào nút Chart Elements (biểu tượng dấu cộng) nằm ngay bên cạnh biểu đồ.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 639–643
- id: n3076103558
  app: excel
  topic: Thiết kế dữ liệu
  fact: Để tránh trùng lặp dữ liệu và tiết kiệm dung lượng, hãy tách thông tin thành các bảng riêng biệt và liên kết chúng bằng các mã định danh
    duy nhất (khóa chính).
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 189–193
- id: n3074990849
  app: excel
  topic: Thiết lập 3D Map
  fact: Trong bảng điều khiển Layer của 3D Map, bạn cần gán đúng các trường dữ liệu vào các mục Location (địa điểm), Height (giá trị), Category
    (phân loại) và Time (thời gian) để biểu đồ hiển thị chính xác.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 682–688
- id: n3075047494
  app: excel
  topic: Thiết lập bài toán tối ưu
  fact: Trong các bài toán vận tải, việc tính tổng hàng xuất (theo hàng) và tổng hàng nhận (theo cột) là bước bắt buộc để thiết lập các ràng buộc
    (constraints) cho công cụ Solver.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 863–866
- id: n3075120823
  app: excel
  topic: Thiết lập Data Table
  fact: Khi tạo bảng dữ liệu, ô đầu vào (Input Cell) phải là ô tham chiếu trong công thức gốc mà bạn muốn thay đổi giá trị để quan sát kết quả.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 1015–1018
- id: n3075073762
  app: excel
  topic: Thiết lập giới hạn (Bounds)
  fact: Khi sử dụng Evolutionary Solver, hãy đặt giới hạn (lower và upper bounds) hợp lý cho các ô thay đổi; nếu phạm vi quá rộng sẽ làm chậm
    quá trình tìm kiếm, còn quá hẹp có thể khiến Solver không tìm được nghiệm tối ưu.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 921–924
- id: n3075075868
  app: excel
  topic: Thiết lập hình phạt (Penalty)
  fact: Trong tối ưu hóa, mức phạt cần đủ lớn để ngăn chặn các giải pháp sai lệch, nhưng không được quá lớn vì có thể khiến Solver bỏ qua các
    ràng buộc thực tế.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 921–924
- id: n3075044788
  app: excel
  topic: Thông báo lỗi Solver
  fact: Thông báo 'Solver could not find a feasible solution' nghĩa là nguồn lực hiện tại không đủ để đáp ứng nhu cầu, còn 'Set values do not
    converge' thường là dấu hiệu mô hình bị lỗi logic hoặc thiết lập sai.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 855–858
- id: n3076111486
  app: excel
  topic: Thứ tự trường trong báo cáo
  fact: Các trường sẽ xuất hiện trong báo cáo theo đúng thứ tự bạn chọn trong danh sách Selected Fields của Report Wizard, vì vậy hãy chọn chúng
    theo thứ tự mong muốn ngay từ đầu.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 209–215
- id: n3074971244
  app: excel
  topic: Tiêu đề biểu đồ động
  fact: Để tiêu đề biểu đồ tự động thay đổi theo dữ liệu, hãy sử dụng công thức Excel để tạo chuỗi văn bản mong muốn trong một ô, sau đó liên
    kết tiêu đề biểu đồ với ô đó.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 656–658
- id: n3076096580
  app: excel
  topic: Tìm kiếm hiệu quả
  fact: Bạn có thể thay đổi nguồn tìm kiếm (trực tuyến hoặc ngoại tuyến) bằng cách nhấp vào mũi tên bên cạnh ô tìm kiếm trong cửa sổ Help để có
    kết quả chính xác hơn.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 169–175

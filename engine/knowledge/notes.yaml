  fact: Bạn có thể chọn toàn bộ worksheet bằng cách bấm vào nút tam giác giao giữa các tiêu đề hàng và cột trước khi áp dụng tên vùng.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 46–50
- id: n3008083788
  app: excel
  topic: Array Formulas
  fact: Khi chỉnh sửa công thức mảng cho nhiều ô, cần chọn toàn bộ vùng mảng, nhấn phím F2, sửa nội dung và kết thúc bằng tổ hợp phím Ctrl+Shift+Enter.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 479–481
- id: n3008079215
  app: excel
  topic: AutoFilter
  fact: Tính năng AutoFilter tự động thêm các mũi tên thả xuống vào hàng tiêu đề của bảng giúp dễ dàng truy vấn dữ liệu theo các điều kiện AND.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 434–439
- id: n3008080641
  app: excel
  topic: AutoFilter
  fact: Ban co the them lenh AutoFilter vao Quick Access Toolbar de loc nhanh du lieu trong bang ma khong can phai vao lai tab Data.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 448–454
- id: n3008103282
  app: excel
  topic: Bar of Pie Chart
  fact: Biểu đồ Bar of Pie rất hữu ích khi bạn có nhiều danh mục nhỏ giúp giảm bớt sự lộn xộn bằng cách tách chúng sang một biểu đồ cột phụ.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 631–638
- id: n3009906936
  app: excel
  topic: Biểu đồ 3-D
  fact: Nên tránh sử dụng các tùy chọn biểu đồ cột 3-D vì hiệu ứng không gian làm việc so sánh giá trị dữ liệu trở nên khó khăn hơn.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 617–622
- id: n3009909412
  app: excel
  topic: Biểu đồ Bar of Pie
  fact: Sử dụng biểu đồ Bar of Pie giúp giảm độ rối khi có quá nhiều danh mục nhỏ bằng cách gộp chúng vào một thanh riêng biệt.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 631–638
- id: n3008105348
  app: excel
  topic: Biểu đồ bong bóng
  fact: Biểu đồ bong bóng cho phép tóm tắt trực quan ba biến số, với kích thước mỗi bong bóng tỷ lệ thuận với giá trị dữ liệu.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 644–649
- id: n3009910910
  app: excel
  topic: Biểu đồ bong bóng
  fact: Biểu đồ bong bóng cho phép trực quan hóa mối quan hệ giữa ba biến số khác nhau trên cùng một biểu đồ.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 644–649
- id: n3008099034
  app: excel
  topic: Biểu đồ cột
  fact: Có thể làm biểu đồ sinh động hơn bằng cách thay thế các cột thông thường bằng hình ảnh minh họa.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 617–622
- id: n3008098393
  app: excel
  topic: Biểu đồ cột 3D
  fact: Nên tránh dùng biểu đồ cột dạng 3-D vì giá trị diện tích và thể tích làm cho việc so sánh dữ liệu trực quan trở nên khó khăn hơn.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 617–622
- id: n3008101608
  app: excel
  topic: Biểu đồ cột và nhãn năm
  fact: Khi tạo biểu đồ cột, nếu vùng chọn bao gồm ô tiêu đề năm ở góc trên bên trái, Excel có thể nhận diện sai năm thành một chuỗi dữ liệu thay
    vì nhãn trục ngang.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 631–638
- id: n3009912328
  app: excel
  topic: Biểu đồ dải
  fact: Sử dụng biểu đồ cột chồng (Stacked Column) kết hợp với các giá trị giới hạn trên và dưới giúp theo dõi sự thay đổi của dữ liệu theo thời
    gian so với mức chuẩn.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 650–655
- id: n3008106951
  app: excel
  topic: Biểu đồ dải (Band Chart)
  fact: Sử dụng biểu đồ cột chồng (Stacked Column) là một cách hiệu quả để theo dõi dữ liệu nằm trong khoảng giới hạn trên và dưới theo thời gian.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 650–655
- id: n3009907461
  app: excel
  topic: Biểu đồ hình ảnh
  fact: Có thể thay thế các cột đơn điệu trong biểu đồ bằng hình ảnh sản phẩm để trực quan hóa dữ liệu tốt hơn.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 617–622
- id: n3009908943
  app: excel
  topic: Biểu đồ hình tròn
  fact: Nên tránh sử dụng biểu đồ hình tròn dạng 3D (3-D Pie) vì kiểu hiển thị này có xu hướng làm bóp méo và hiển thị sai lệch tỷ lệ thực tế
    của dữ liệu.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 631–638
- id: n3008100169
  app: excel
  topic: Biểu đồ kết hợp
  fact: Sử dụng biểu đồ kết hợp (Combo chart) giúp dễ dàng so sánh hai chuỗi dữ liệu có đặc tính hoặc đơn vị khác nhau trên cùng một biểu đồ.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 623–630
- id: n3008075962
  app: excel
  topic: Biểu đồ Pareto
  fact: Biểu đồ Pareto kết hợp giữa cột và đường để thể hiện quy tắc 80-20, trong đó các giá trị cột được sắp xếp giảm dần và đường thể hiện phần
    trăm tích lũy.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 400–404
- id: n3009917611
  app: excel
  topic: Biểu đồ Sunburst
  fact: Khi biểu đồ Treemap gặp lỗi thiếu không gian hiển thị nhãn (như các danh mục quá nhỏ), sử dụng biểu đồ Sunburst là một giải pháp thay
    thế hiệu quả.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 669–675
- id: n3009917189
  app: excel
  topic: Biểu đồ Treemap
  fact: Biểu đồ Treemap giúp hiển thị dữ liệu phân cấp và tỷ trọng, trong đó các mục có cùng cấp cha sẽ hiển thị cùng màu.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 669–675
- id: n3008110897
  app: excel
  topic: Biểu đồ Treemap và Sunburst
  fact: Biểu đồ Treemap phù hợp để hiển thị dữ liệu phân cấp nhiều tầng nhưng có thể bị hạn chế không gian hiển thị nhãn, trong khi biểu đồ Sunburst
    giải quyết tốt hơn vấn đề này bằng dạng hình tròn đồng tâm.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 669–675
- id: n3008102517
  app: excel
  topic: Biểu đồ tròn 3D
  fact: Nên hạn chế sử dụng biểu đồ tròn 3D vì hiệu ứng không gian có thể làm méo mó và khó so sánh chính xác các số liệu.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 631–638
- id: n3008064451
  app: excel
  topic: Biểu đồ từ bảng dữ liệu
  fact: Trước khi vẽ biểu đồ từ bảng dữ liệu hai chiều, bạn cần sao chép bảng ra một vùng khác và xóa giá trị ở ô góc trên bên trái của vùng sao
    chép.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 211–213
- id: n3009850111
  app: excel
  topic: Biểu đồ từ bảng dữ liệu
  fact: Trước khi vẽ biểu đồ từ bảng dữ liệu hai chiều, bạn nên sao chép dữ liệu sang vùng khác và xóa ô giao nhau trống để Excel nhận diện đúng
    các chuỗi dữ liệu.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 211–213
- id: n3009908514
  app: excel
  topic: Biểu đồ và dữ liệu trống
  fact: Khi biểu đồ có dữ liệu trống, bạn có thể cấu hình để Excel hiển thị dạng số không, để trống hoặc nối đường thẳng giữa các điểm liền kề.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 623–630
- id: n3008110507
  app: excel
  topic: Biểu đồ Waterfall
  fact: Biểu đồ Waterfall rất hữu ích để minh họa tiến trình dòng tiền hoặc phân tách doanh thu thành chi phí và lợi nhuận.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 664–668
- id: n3009916624
  app: excel
  topic: Biểu đồ Waterfall
  fact: Biểu đồ thác nước rất hữu ích để minh họa quá trình chuyển biến từ doanh thu ban đầu qua các khoản chi phí để đạt được lợi nhuận cuối
    cùng.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 664–668
- id: n3008079483
  app: excel
  topic: Biểu tượng bộ lọc
  fact: Khi một cột được áp dụng bộ lọc, biểu tượng mũi tên trên tiêu đề cột sẽ chuyển thành hình chiếc phễu.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 440–447
- id: n3009871667
  app: excel
  topic: Bin Ranges trong Histogram
  fact: Nên tự định nghĩa các khoảng bin (từ 8 đến 15 khoảng đều nhau) thay vì để Excel tự chọn để biểu đồ dễ đọc và trực quan hơn.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 388–391
- id: n3008077689
  app: excel
  topic: Boxplot
  fact: Biểu đồ hộp hiển thị năm giá trị thống kê quan trọng bao gồm giá trị nhỏ nhất, lớn nhất, tứ phân vị thứ nhất, trung vị và tứ phân vị thứ
    ba.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 416–420
- id: n3008124182
  app: excel
  topic: Các loại Engine trong Solver
  fact: Excel Solver cung cấp 3 engine chính gồm Simplex LP cho bài toán tuyến tính, GRG Nonlinear cho bài toán phi tuyến tính và Evolutionary
    Solver cho các hàm phi mượt chứa hàm điều kiện hoặc thống kê.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 843–846
- id: n3008124562
  app: excel
  topic: Cài đặt Solver
  fact: Nếu không thấy Solver trong tab Data, bạn cần vào File > Options > Add-Ins để kích hoạt tiện ích này trước khi sử dụng.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 847–849
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 876–879
- id: n3008089813
  app: excel
  topic: Calculated Field
  fact: Trường tính toán cho phép bạn tạo công thức dựa trên các trường khác sẵn có trong PivotTable để phân tích dữ liệu chi tiết hơn.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 541–546
- id: n3008074665
  app: excel
  topic: Cập nhật dữ liệu
  fact: Sử dụng tính năng Refresh All trong thẻ Data giúp cập nhật nhanh chóng tất cả các công thức có gắn kiểu dữ liệu trong bảng tính.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 368–374
- id: n3009894159
  app: excel
  topic: Cập nhật dữ liệu PivotTable
  fact: Khi nguồn dữ liệu gốc thay đổi, bạn có thể nhấp chuột phải vào PivotTable và chọn Refresh để cập nhật các tính toán mới nhất.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 528–534
- id: n3009910448
  app: excel
  topic: Chart Elements
  fact: Nút Chart Elements (dấu cộng) xuất hiện bên phải biểu đồ giúp bạn nhanh chóng thêm hoặc bớt các thành phần như nhãn dữ liệu và tiêu đề.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 639–643
- id: n3008060809
  app: excel
  topic: Chèn thời gian tĩnh
  fact: Có thể nhanh chóng chèn thời gian hiện tại cố định vào một ô bằng cách nhấn tổ hợp phím tắt Ctrl+Shift+;
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 175–180
- id: n3008107715
  app: excel
  topic: Chọn vùng dữ liệu không liền kề
  fact: Có thể sử dụng phím Ctrl kết hợp nhấp chuột để chọn nhiều vùng dữ liệu khác nhau không nằm cạnh nhau trên bảng tính.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 656–658
- id: n3008059001
  app: excel
  topic: Circular References
  fact: Tham chiếu vòng xảy ra khi các ô phụ thuộc lẫn nhau tạo thành một vòng lặp, Excel có thể giải quyết việc này tự động nếu bật tính năng
    tính toán lặp.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 141–144
- id: n3008059489
  app: excel
  topic: Circular References
  fact: Bạn cần bật tùy chọn Enable Iterative Calculation trong Excel Options khi bảng tính có chứa các tham chiếu vòng.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 155–157
- id: n3008063084

  fact: Các giá trị được tạo ra bởi hàm RAND trong các ô khác nhau là hoàn toàn độc lập, giá trị của ô này không ảnh hưởng đến giá trị của ô kia.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 940–943

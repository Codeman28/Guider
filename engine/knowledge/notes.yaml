  fact: Sử dụng Ctrl + Home để về đầu văn bản và Ctrl + End để về cuối văn bản giúp di chuyển nhanh chóng mà không cần cuộn chuột.
  sources:
  - Bai tap Tin hoc FTU2.pdf, trang 51–54

  sources:
  - Bai tap Tin hoc FTU2.pdf, trang 51–54
- id: n3076663508
  app: word
  topic: Di chuyển nhanh
  fact: Sử dụng kết hợp phím Ctrl với các phím mũi tên hoặc phím Home/End giúp di chuyển con trỏ theo từng từ hoặc từng đoạn văn thay vì từng

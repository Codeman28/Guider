  topic: Phím tắt định dạng đoạn văn
  fact: Sử dụng các tổ hợp phím Ctrl+1, Ctrl+2, Ctrl+5 để nhanh chóng thay đổi khoảng cách dòng (giãn dòng đơn, đôi, hoặc 1.5) cho đoạn văn đang
    chọn.
  sources:
  - Keyboard shortcuts in Word | Microsoft Support, https://support.microsoft.com/en-us/accessibility/word/keyboard-shortcuts-in-word
- id: n3076679264
  app: word
  topic: Phím tắt F10
  fact: Nhấn F10 để bật hoặc tắt KeyTips, giúp hiển thị các ký tự phím tắt trên thanh Ribbon để điều khiển Word hoàn toàn bằng bàn phím.
  sources:
  - Keyboard shortcuts in Word | Microsoft Support, https://support.microsoft.com/en-us/accessibility/word/keyboard-shortcuts-in-word
- id: n3076677821
  app: word
  topic: Phím tắt F6
  fact: Phím F6 rất hữu ích để di chuyển nhanh sự tập trung giữa các thành phần như vùng soạn thảo, thanh trạng thái và thanh Ribbon mà không
    cần dùng chuột.
  sources:
  - Keyboard shortcuts in Word | Microsoft Support, https://support.microsoft.com/en-us/accessibility/word/keyboard-shortcuts-in-word
- id: n3076676384
  app: word
  topic: Phím tắt F8
  fact: Phím F8 dùng để mở rộng vùng chọn văn bản. Nhấn F8 nhiều lần sẽ mở rộng dần từ từ, câu, đoạn đến toàn bộ tài liệu.
  sources:
  - Keyboard shortcuts in Word | Microsoft Support, https://support.microsoft.com/en-us/accessibility/word/keyboard-shortcuts-in-word
- id: n3076058517
  app: word
  topic: Phím tắt in ấn
  fact: Sử dụng tổ hợp phím Ctrl+P là cách nhanh nhất để truy cập ngay vào bảng điều khiển in ấn thay vì phải tìm trong menu File.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 9–19

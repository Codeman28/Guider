    không xác định được độ dốc.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 910–913
- id: n3075037080
  app: excel
  topic: Hạn chế của hàm STOCKHISTORY
  fact: Dữ liệu trả về bởi hàm STOCKHISTORY không bao gồm các khoản cổ tức.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 833–836
- id: n3075001705
  app: excel
  topic: Hạn chế của Trendline
  fact: Tính năng Trendline mặc định của Excel không phải lúc nào cũng tìm ra phương trình tối ưu nhất cho đường cong lũy thừa vì nó không thực
    sự tối thiểu hóa tổng bình phương sai số.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 719–722
- id: n3074986864
  app: excel
  topic: Heat map
  fact: Sử dụng tùy chọn Series Color trong bảng Format Data Series để tạo bản đồ nhiệt 2 hoặc 3 màu, giúp làm nổi bật sự khác biệt về doanh số
    giữa các khu vực.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 676–681
- id: n3076062926
  app: excel
  topic: Hiển thị công thức
  fact: Việc hiển thị công thức rất hữu ích khi bạn cần kiểm tra lỗi logic hoặc đối chiếu tham chiếu vùng dữ liệu trong bảng tính lớn.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 41–49
- id: n3075068063
  app: excel
  topic: Hiệu quả của Multistart
  fact: Tính năng Multistart hoạt động hiệu quả nhất khi bạn thiết lập các giới hạn trên và dưới hợp lý cho các ô thay đổi (changing cells).
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 910–913
- id: n3075145483
  app: excel
  topic: Hiệu suất công thức
  fact: Việc lặp lại cùng một hàm (như SUM) nhiều lần trong một công thức dài sẽ làm giảm hiệu suất tính toán của Excel; hãy cân nhắc dùng LET
    để tối ưu.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 1075–1078
- id: n3076449980
  app: excel
  topic: Hỗ trợ kỹ thuật
  fact: Microsoft cung cấp dịch vụ Disability Answer Desk để hỗ trợ người dùng khuyết tật sử dụng các công nghệ hỗ trợ trên phần mềm của họ.
  sources:
  - Keyboard shortcuts in Excel | Microsoft Support, https://support.microsoft.com/en-us/accessibility/excel/keyboard-shortcuts-in-excel
- id: n3076064710
  app: excel
  topic: Hoàn tác thao tác
  fact: Nếu thực hiện nhầm thao tác như xóa cột hoặc thay đổi độ rộng, hãy sử dụng nút Undo trên thanh công cụ truy cập nhanh để quay lại trạng
    thái trước đó.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 50–59
- id: n3075018983
  app: excel
  topic: Hồi quy tuyến tính
  fact: Khi phân tích nhiều biến (như giá cả, thời tiết, khuyến mãi), hãy đảm bảo các biến độc lập được đặt trong các cột liền kề để dễ dàng chọn
    vùng dữ liệu cho mô hình hồi quy.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 760–762
- id: n3075005237
  app: excel
  topic: Hồi quy về giá trị trung bình (Regression toward the mean)
  fact: Đây là hiện tượng giá trị dự đoán của biến phụ thuộc thường có xu hướng gần với giá trị trung bình hơn so với biến độc lập.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 729–732
- id: n3075110801
  app: excel
  topic: In ấn
  fact: Bạn có thể tùy chọn in chú thích kèm theo trang tính bằng cách thiết lập trong tab Sheet của hộp thoại Page Setup, cho phép in ngay tại
    vị trí ô hoặc gom lại ở cuối trang.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 974–976
- id: n3076427603
  app: excel
  topic: Key Tips
  fact: Nhấn phím Alt sẽ hiển thị các ký tự gợi ý (Key Tips) trên thanh Ribbon, cho phép bạn truy cập bất kỳ lệnh nào bằng bàn phím mà không cần
    dùng chuột.
  sources:
  - Keyboard shortcuts in Excel | Microsoft Support, https://support.microsoft.com/en-us/accessibility/excel/keyboard-shortcuts-in-excel
- id: n3075068647
  app: excel
  topic: Khi nào dùng Evolutionary Solver
  fact: Nên sử dụng Evolutionary Solver cho các bài toán tối ưu hóa 'phi tuyến tính' (nonsmooth), nơi mà các hàm mục tiêu hoặc ràng buộc không
    có độ dốc hoặc có nhiều đỉnh/thung lũng.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 910–913
- id: n3075073089
  app: excel
  topic: Khi nào dùng Evolutionary Solver
  fact: Evolutionary Solver là lựa chọn phù hợp nhất cho các bài toán chứa hàm không trơn (nonsmooth) như IF, ABS, MAX, MIN, COUNTIF, SUMIF, AVERAGEIF.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 921–924
- id: n3075057383
  app: excel
  topic: Khi nào dùng Solver
  fact: Solver là công cụ mạnh mẽ để giải các bài toán tài chính phức tạp, đặc biệt khi lãi suất hoặc lợi nhuận đầu tư không cố định và không
    thể dùng các hàm tài chính thông thường của Excel.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 880–883
- id: n3076098472
  app: excel
  topic: Khóa chính (Primary Key)
  fact: Mỗi bảng trong Access mặc định có một trường ID là khóa chính với kiểu dữ liệu AutoNumber, giúp định danh duy nhất cho từng bản ghi.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 181–184
- id: n3075124450
  app: excel
  topic: Kích hoạt Solver Add-in
  fact: Nếu không thấy Solver trong tab Data, bạn cần vào File > Options > Add-ins, chọn Excel Add-ins rồi nhấn Go để tích chọn Solver Add-in.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 1023–1026
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 1032–1037
- id: n3075009573
  app: excel
  topic: Kiểm chứng mô hình (Model Validation)
  fact: Khi xây dựng mô hình hồi quy, hãy luôn giữ lại một phần dữ liệu không dùng để huấn luyện mô hình, nhằm kiểm tra xem mô hình có khả năng
    dự báo chính xác trên các dữ liệu mới hay không.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 748–751
- id: n3075008768
  app: excel
  topic: Kiểm tra độ chính xác
  fact: Phần dư (residuals) giúp kiểm tra xem có giá trị ngoại lai (outliers) hay không; nếu giá trị phần dư nằm trong phạm vi cho phép, mô hình
    dự báo được coi là đáng tin cậy.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 743–747
- id: n3075148764
  app: excel
  topic: Kiểm tra hàm nhanh
  fact: 'Bạn có thể kiểm tra nhanh logic của hàm LAMBDA ngay trong ô tính bằng cách thêm các tham số vào sau định nghĩa, ví dụ: =LAMBDA(x,y,x*y)(2,3)
    sẽ trả về 6.'
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 1079–1083
- id: n3075071042
  app: excel
  topic: Kiểm tra ràng buộc
  fact: Nếu Solver đưa ra kết quả sát với giá trị ràng buộc bạn đặt ra, đó là dấu hiệu cho thấy ràng buộc đó quá chặt và bạn nên nới lỏng nó để
    tìm được kết quả chính xác hơn.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 914–920
- id: n3075015047
  app: excel
  topic: Kiểm tra ý nghĩa thống kê
  fact: Trong phân tích hồi quy, nếu giá trị p-value của một biến nhỏ hơn 0.15, biến đó được coi là có ý nghĩa thống kê và có tác động đáng kể
    đến kết quả.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 755–759
- id: n3076107639
  app: excel
  topic: Kiểu dữ liệu cho mã bưu chính
  fact: Nên chọn kiểu dữ liệu Text thay vì Number cho các trường như mã bưu chính (ZIP code) để có thể nhập được các ký tự đặc biệt hoặc mã quốc
    tế, thay vì chỉ giới hạn ở các con số.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 194–197
- id: n3075150227
  app: excel
  topic: LAMBDA helper functions
  fact: Các hàm hỗ trợ LAMBDA (như BYROW, MAP, REDUCE...) giúp đơn giản hóa việc viết các công thức mảng phức tạp bằng cách tự động hóa việc lặp
    qua các hàng hoặc cột.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 1084–1088
- id: n3075053981
  app: excel
  topic: Lập kế hoạch tài chính
  fact: Bạn có thể dùng Solver để kiểm chứng độ chính xác của hàm PMT hoặc tính toán các khoản thanh toán thế chấp với lãi suất biến đổi thay
    vì chỉ dùng công thức tài chính thông thường.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 876–879
- id: n3076113102
  app: excel
  topic: Layout View vs Design View
  fact: Khi cần chỉnh sửa bố cục đơn giản, hãy ưu tiên sử dụng Layout view vì bạn có thể thấy dữ liệu thực tế ngay trong lúc thao tác, giúp việc
    căn chỉnh trực quan hơn.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 209–215
- id: n3074973178
  app: excel
  topic: Liên kết nhãn chuỗi dữ liệu
  fact: Bạn có thể liên kết tên của một chuỗi dữ liệu (Series Name) trong biểu đồ với một ô cụ thể bằng cách vào Select Data, chọn Edit chuỗi
    đó và nhập tham chiếu ô vào ô Series Name.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 656–658
- id: n3074966005
  app: excel
  topic: Lọc biểu đồ
  fact: Tính năng Chart Filters cho phép bạn ẩn tạm thời các chuỗi dữ liệu mà không cần xóa dữ liệu gốc trong bảng tính.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 644–649
- id: n3072971355
  app: excel
  topic: Lọc dữ liệu
  fact: Sử dụng phím tắt Ctrl+Shift+L là cách nhanh nhất để bật hoặc tắt tính năng Auto Filter trên vùng dữ liệu đã chọn.
  sources:
  - Bai tap Tin hoc FTU2.pdf, trang 70–72
  - Bai tap Tin hoc FTU2.pdf, trang 80–85
- id: n3076066183
  app: excel
  topic: 'Lỗi hiển thị ####'
  fact: 'Khi ô hiển thị ký tự ####, điều đó có nghĩa là độ rộng của cột không đủ để chứa dữ liệu; bạn chỉ cần kéo rộng cột ra là dữ liệu sẽ hiện
    lại bình thường.'
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 60–66
- id: n3074951432
  app: excel
  topic: Lợi ích của hàm SUBTOTAL
  fact: Hàm SUBTOTAL linh hoạt hơn lệnh Subtotal trên ribbon vì cho phép bạn tự chọn loại phép tính (như SUM, AVERAGE, COUNT) thông qua mã số
    thay vì bị giới hạn bởi giao diện.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 611–616
- id: n3074995068
  app: excel
  topic: Lựa chọn đường xu hướng
  fact: Chọn Linear khi dữ liệu có xu hướng đường thẳng; chọn Exponential hoặc Power khi dữ liệu tăng/giảm theo tốc độ thay đổi; chọn Moving Average
    để làm mượt dữ liệu chuỗi thời gian.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 701–705
- id: n3076099561
  app: excel
  topic: Lưu dữ liệu
  fact: Trong Excel, bạn nên thường xuyên nhấn Ctrl+S để lưu tệp, vì không giống như Access tự động lưu từng bản ghi, Excel cần thao tác lưu thủ
    công để bảo toàn dữ liệu.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 181–184
- id: n3076101519
  app: excel
  topic: Lưu dữ liệu
  fact: Trong các ứng dụng cơ sở dữ liệu, việc lưu bảng trước khi đóng là bắt buộc để tránh mất dữ liệu vừa nhập.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 185–188
- id: n3075140351
  app: excel
  topic: Mã VBA
  fact: Việc ghi macro thực chất là tạo ra mã VBA; tuy nhiên, mã này thường chứa nhiều lệnh thừa và không tối ưu, bạn có thể xem bằng cách chọn
    Edit trong hộp thoại Macros.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 1060–1065
- id: n3076105000
  app: excel
  topic: Menu chuột phải
  fact: Bạn có thể thực hiện nhanh các lệnh ẩn, hiện hoặc cố định cột bằng cách nhấp chuột phải trực tiếp vào tiêu đề cột thay vì tìm trên thanh
    Ribbon.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 189–193
- id: n3075125025
  app: excel
  topic: Mô hình phi tuyến tính
  fact: 'Khi hàm mục tiêu là tích của các biến phụ thuộc vào ô thay đổi (ví dụ: nhu cầu nhân với biên lợi nhuận), Solver sẽ xử lý đây là mô hình
    phi tuyến tính.'
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 1023–1026
- id: n3074997092
  app: excel
  topic: Mô hình tăng trưởng
  fact: Sử dụng đường xu hướng hàm mũ (Exponential) khi dữ liệu có tốc độ tăng trưởng theo tỷ lệ phần trăm không đổi thay vì tăng theo số lượng
    tuyệt đối.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 709–713
- id: n3075039680
  app: excel
  topic: Mô hình tối ưu hóa Solver
  fact: 'Một mô hình tối ưu hóa trong Solver luôn cần ba thành phần: ô mục tiêu (Target cell), ô thay đổi (Changing cell) và các ràng buộc (Constraints).'
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 837–842
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 867–871
- id: n3075083646
  app: excel
  topic: Mô phỏng Monte Carlo
  fact: Đây là kỹ thuật mạnh mẽ để mô hình hóa các tình huống không chắc chắn bằng cách chạy thử nghiệm hàng nghìn lần trên máy tính để ước tính
    xác suất rủi ro.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 940–943
- id: n3075108774
  app: excel
  topic: Mô phỏng Monte Carlo
  fact: Bạn có thể dùng hàm NORM.INV kết hợp với RAND để mô phỏng các kết quả ngẫu nhiên dựa trên phân phối chuẩn, rất hữu ích để dự đoán xác
    suất thắng thua.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 974–976
- id: n3076425144
  app: excel
  topic: Mở rộng vùng chọn
  fact: Sử dụng Ctrl+Shift+Phím mũi tên giúp bạn chọn nhanh toàn bộ dữ liệu từ vị trí hiện tại đến ô trống gần nhất, rất hữu ích cho bảng dữ liệu
    lớn.
  sources:
  - Keyboard shortcuts in Excel | Microsoft Support, https://support.microsoft.com/en-us/accessibility/excel/keyboard-shortcuts-in-excel
- id: n3076108713
  app: excel
  topic: Mối quan hệ giữa các bảng (Database Relationships)
  fact: Trong cơ sở dữ liệu, mối quan hệ một-nhiều (one-to-many) là phổ biến nhất, nơi một bản ghi ở bảng này liên kết với nhiều bản ghi ở bảng
    khác thông qua khóa chính và khóa ngoại.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 198–201
- id: n3075004666
  app: excel
  topic: Mối quan hệ giữa Tương quan và R-squared
  fact: Hệ số tương quan bằng căn bậc hai của R-squared, với dấu dương hoặc âm phụ thuộc vào độ dốc của đường xu hướng.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 729–732
- id: n3076109847
  app: excel
  topic: Mối quan hệ nhiều-nhiều (Many-to-many)
  fact: Mối quan hệ nhiều-nhiều thường được xử lý bằng cách sử dụng một bảng trung gian để kết nối hai bảng chính, tạo thành hai mối quan hệ một-nhiều
    riêng biệt.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 198–201
- id: n3075046009
  app: excel
  topic: Multiple Solutions
  fact: Một bài toán tối ưu có thể có nhiều nghiệm tối ưu khác nhau; nếu chạy lại Solver, bạn có thể nhận được kết quả khác nhưng vẫn đảm bảo

  fact: Để tạo mục lục tự động, bạn bắt buộc phải áp dụng các kiểu định dạng Heading cho các tiêu đề trong tài liệu trước.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 20–27
- id: n3072767027
  app: word

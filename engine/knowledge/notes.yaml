  fact: Khi chạy phân tích phương sai hai yếu tố có lặp lại trong Excel, bạn cần đảm bảo dữ liệu đầu vào có các nhãn cho từng mức độ của cột và
    hàng, đồng thời xác định chính xác số lượng hàng cho mỗi mẫu (Rows Per Sample).
  sources:

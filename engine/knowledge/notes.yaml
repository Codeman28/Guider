  fact: Khi sử dụng bảng mã Unicode, các font chữ chuẩn như Times New Roman, Arial, Tahoma đều hỗ trợ hiển thị tiếng Việt chính xác.
  sources:
  - Bai tap Tin hoc FTU2.pdf, trang 47–50
- id: n3072953656
  app: word

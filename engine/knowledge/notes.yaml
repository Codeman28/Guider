  app: word
  topic: Phím tắt định dạng
  fact: Sử dụng phím tắt như Ctrl+B (Bold), Ctrl+I (Italic), Ctrl+U (Underline) giúp thao tác định dạng văn bản nhanh hơn nhiều so với việc di

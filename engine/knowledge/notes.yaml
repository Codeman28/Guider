  fact: Độ phân giải màn hình càng cao thì càng hiển thị được nhiều nút lệnh trên Ribbon; ngược lại, tăng độ phóng đại (DPI) sẽ làm các biểu tượng
    lớn hơn nhưng hiển thị được ít công cụ hơn.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 86–90
- id: n2950952391
  app: word
  topic: Document Views
  fact: The View tab allows switching between different document views (Print Layout, Full Screen Reading, Web Layout, Outline, Draft). Print
    Layout is recommended for final document preparation.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf · trang 26–32
- id: n3009867523
  app: word
  topic: Đổi tên để tránh lỗi cột
  fact: Khi dữ liệu có khoảng trắng làm phân cách, hãy dùng tính năng Replace để rút gọn các cụm từ dài thành một từ duy nhất nhằm tránh bị tách
    thành nhiều cột không mong muốn khi sang Excel.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 336–338
- id: n3072954707
  app: word
  topic: Drop Cap
  fact: Drop Cap thường được sử dụng để tạo điểm nhấn thẩm mỹ cho đoạn văn bản đầu tiên của một bài báo hoặc chương sách.
  sources:
  - Bai tap Tin hoc FTU2.pdf, trang 19–22
- id: n2949686332

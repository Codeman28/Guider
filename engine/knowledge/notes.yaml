  fact: Các phiên bản Microsoft 365 hiển thị tất cả tùy chọn như hướng giấy, khổ giấy và máy in ngay trên một màn hình duy nhất, giúp bạn không
    cần mở thêm hộp thoại Properties phức tạp như các phiên bản cũ.

  fact: Bạn có thể nhấn phím Alt hoặc F10 để kích hoạt các phím truy cập nhanh trên Ribbon, sau đó dùng phím mũi tên để di chuyển giữa các lệnh.
  sources:
  - Keyboard shortcuts in Word | Microsoft Support, https://support.microsoft.com/en-us/accessibility/word/keyboard-shortcuts-in-word
- id: n3076705778
  app: word
  topic: Điều hướng Ribbon
  fact: Nhấn Alt+Dấu chấm để kích hoạt các phím truy cập trên thanh Ribbon, giúp bạn điều hướng bằng bàn phím hiệu quả hơn.
  sources:
  - Keyboard shortcuts in Word | Microsoft Support, https://support.microsoft.com/en-us/accessibility/word/keyboard-shortcuts-in-word
- id: n3076059975
  app: word

  fact: Để quản lý tệp tin và thư mục, công cụ chính được sử dụng là Windows Explorer (File Explorer), trong khi Control Panel được dùng để thiết
    lập các cài đặt hệ thống.
  sources:
  - Bai tap Tin hoc FTU2.pdf, trang 6–9

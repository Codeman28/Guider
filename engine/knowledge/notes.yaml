  sources:
  - Keyboard shortcuts in Excel | Microsoft Support, https://support.microsoft.com/en-us/accessibility/excel/keyboard-shortcuts-in-excel
- id: n3076441221
  app: excel
  topic: Tìm kiếm phím tắt
  fact: Bạn có thể nhấn Ctrl+F để mở hộp thoại tìm kiếm và gõ từ khóa nhằm tìm nhanh các phím tắt hoặc lệnh trong Excel.
  sources:
  - Keyboard shortcuts in Excel | Microsoft Support, https://support.microsoft.com/en-us/accessibility/excel/keyboard-shortcuts-in-excel
- id: n3075083055
  app: excel

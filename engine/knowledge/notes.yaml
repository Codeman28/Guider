  fact: Giao diện Ribbon tự động thay đổi cách sắp xếp nút bấm dựa trên không gian có sẵn; nếu cửa sổ hẹp, các nhóm lệnh có thể bị thu gọn thành
    một nút duy nhất.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 86–90
- id: n3076115077
  app: word
  topic: Hiệu quả định dạng
  fact: Nên định dạng chung cho toàn bộ các đối tượng trước, sau đó mới điều chỉnh riêng lẻ cho từng đối tượng cần khác biệt để tiết kiệm thời
    gian.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 216–220

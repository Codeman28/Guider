  - 1702861677MICROSOFT-OFFICE-BOOK.pdf · trang 13–20
- id: n2950502983
  app: word
  topic: Keyboard Shortcuts
  fact: 'Phím tắt để mở thanh công cụ: Ctrl + Q (truy cập Quick Access Toolbar), Ctrl + P (in), Ctrl + S (lưu).'
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf · trang 21–25
- id: n3076057068
  app: word

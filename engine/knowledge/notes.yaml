  topic: Ngắt trang
  fact: Luôn sử dụng phím tắt Ctrl+Enter để ngắt trang thay vì nhấn Enter nhiều lần, giúp văn bản giữ nguyên định dạng khi chỉnh sửa.
  sources:
  - Bai tap Tin hoc FTU2.pdf, trang 34–37
  - Bai tap Tin hoc FTU2.pdf, trang 38–42

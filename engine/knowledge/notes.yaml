  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 1042–1047
- id: n3075133014
  app: excel
  topic: Analyze Data
  fact: Bạn có thể đặt câu hỏi trực tiếp về dữ liệu của mình trong bảng điều khiển Analyze Data hoặc chọn các câu hỏi gợi ý có sẵn để Excel tự
    động tạo phân tích tương ứng.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 1042–1047
- id: n3075134824
  app: excel
  topic: Analyze Data
  fact: Tính năng Analyze Data là công cụ mạnh mẽ để tìm kiếm các xu hướng, mẫu hình hoặc các điểm dữ liệu bất thường (outliers) mà không cần
    phải tự xây dựng công thức phức tạp.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 1048–1055
- id: n3075136069
  app: excel
  topic: Analyze Data
  fact: Tính năng Analyze Data giúp tự động tạo các bảng tổng hợp và biểu đồ dựa trên dữ liệu, rất hữu ích khi bạn cần tìm kiếm xu hướng nhanh
    mà không muốn thiết lập thủ công.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 1056–1059
- id: n3075021009
  app: excel
  topic: ANOVA hai chiều
  fact: Sử dụng ANOVA hai chiều khi bạn muốn kiểm tra xem hai yếu tố có tương tác với nhau hay không, điều này yêu cầu mỗi tổ hợp yếu tố phải
    được quan sát nhiều hơn một lần (k > 1).
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 768–770
- id: n3075149354
  app: excel
  topic: AutoComplete
  fact: Excel sẽ tự động gợi ý tên hàm bạn đã tạo thông qua tính năng AutoComplete khi bạn bắt đầu gõ tên hàm đó trong ô tính.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 1079–1083
- id: n3075151998
  app: excel
  topic: AutoSum
  fact: AutoSum là cách nhanh nhất để tính tổng một cột hoặc hàng mà không cần gõ thủ công hàm SUM.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 1096–1100
- id: n3076086852
  app: excel
  topic: Backstage View
  fact: Trong các ứng dụng Office hiện đại, thẻ File đóng vai trò là trung tâm quản lý tệp tin (Backstage view), thay thế cho các nút Office cũ
    để truy cập nhanh các lệnh như lưu, mở, in và thiết lập tùy chọn.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 150–153
- id: n3075112957
  app: excel
  topic: Bảo vệ công thức
  fact: Để bảo vệ công thức, bạn cần mở khóa toàn bộ bảng tính trước, sau đó chỉ chọn và khóa các ô chứa công thức, cuối cùng mới kích hoạt tính
    năng bảo vệ trang tính (Protect Sheet).
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 989–992
- id: n3075114430
  app: excel
  topic: Bảo vệ trang tính
  fact: Việc bảo vệ trang tính giúp ngăn chặn người dùng vô tình hoặc cố ý thay đổi các công thức quan trọng trong bảng tính của bạn.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 989–992
- id: n3075113555
  app: excel
  topic: Biến động ngụ ý (Implied Volatility)
  fact: Biến động ngụ ý là giá trị biến động được suy ngược từ giá thị trường của quyền chọn, giúp dự báo kỳ vọng của thị trường thay vì chỉ nhìn
    vào dữ liệu lịch sử.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 989–992
- id: n3075007151
  app: excel
  topic: Biến giả (Dummy variables)
  fact: Khi đưa các yếu tố định tính (như quý trong năm) vào hồi quy, cần tạo các biến giả nhận giá trị 0 hoặc 1 để tránh lỗi chia cho 0 do quan
    hệ tuyến tính giữa các biến.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 738–742
- id: n3075012328
  app: excel
  topic: Biến giả (Dummy variables)
  fact: Khi phân tích mùa vụ, bạn cần loại bỏ một quý (thường là quý cuối) khỏi mô hình để tránh hiện tượng đa cộng tuyến hoàn hảo; các quý còn
    lại sẽ được so sánh dựa trên quý bị loại bỏ này.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 752–754
- id: n3075042955
  app: excel
  topic: Biến không âm trong Solver
  fact: Luôn tích chọn 'Make Unconstrained Variables Non-Negative' trong Solver để đảm bảo các giá trị kết quả không bị âm, điều này rất quan
    trọng trong các bài toán kinh doanh thực tế.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 850–854
- id: n3075031604
  app: excel
  topic: Biến ngẫu nhiên nhị thức
  fact: Một biến ngẫu nhiên nhị thức chỉ áp dụng khi có n thử nghiệm độc lập, mỗi thử nghiệm chỉ có hai kết quả (thành công/thất bại) và xác suất
    thành công (p) không đổi qua các lần thử.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 802–804
- id: n3075050024
  app: excel
  topic: Biến nhị phân (Binary Changing Cells)
  fact: 'Trong các bài toán lựa chọn dự án, hãy sử dụng biến nhị phân (0 hoặc 1) để đại diện cho quyết định: 1 nghĩa là thực hiện dự án, 0 nghĩa
    là không thực hiện.'
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 867–871
- id: n3075158085
  app: excel
  topic: Biểu đồ
  fact: Nếu dữ liệu của bạn bị ẩn (hidden), biểu đồ mặc định sẽ không hiển thị các điểm dữ liệu đó trừ khi bạn thay đổi cài đặt trong tùy chọn
    biểu đồ.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 1106–1111
- id: n3074992021
  app: excel
  topic: Biểu đồ 2D trong 3D Map
  fact: Bạn có thể tóm tắt dữ liệu 3D bằng biểu đồ 2D ngay trong giao diện 3D Map bằng cách sử dụng nút 2D Chart trên ribbon 3D Map.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 689–695
- id: n3074965358
  app: excel
  topic: Biểu đồ Bong bóng
  fact: Sử dụng biểu đồ Bong bóng khi bạn cần trực quan hóa mối quan hệ giữa ba biến số khác nhau cùng một lúc.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 644–649
- id: n3074984245
  app: excel
  topic: Biểu đồ chứng khoán
  fact: Excel cung cấp các loại biểu đồ chuyên biệt để phân tích dữ liệu tài chính như giá và khối lượng giao dịch, giúp người dùng dễ dàng theo
    dõi xu hướng thị trường.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 669–675
- id: n3074985050
  app: excel
  topic: Biểu đồ chứng khoán
  fact: 'Các biểu đồ chứng khoán yêu cầu dữ liệu phải được sắp xếp theo thứ tự cột chính xác (ví dụ: Mở, Cao, Thấp, Đóng) để hiển thị đúng các
    thành phần giá.'
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 676–681
- id: n3074952899
  app: excel
  topic: Biểu đồ cột 3D
  fact: Nên tránh sử dụng biểu đồ cột 3D vì các hiệu ứng về diện tích và khối lượng làm sai lệch khả năng so sánh trực tiếp các giá trị dữ liệu.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 617–622
- id: n3074969359
  app: excel
  topic: Biểu đồ dải (Band Chart)
  fact: Biểu đồ dải là công cụ hiệu quả để theo dõi xem một đại lượng (như tồn kho, tiền mặt) có luôn nằm trong khoảng giới hạn trên và dưới cho
    phép hay không.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 650–655
- id: n3074982885
  app: excel
  topic: Biểu đồ Funnel
  fact: Đây là lựa chọn tối ưu để theo dõi các giai đoạn của một quy trình, ví dụ như phễu bán hàng hoặc quy trình tuyển sinh.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 669–675
- id: n3074974955
  app: excel
  topic: Biểu đồ Gantt
  fact: Biểu đồ Gantt thực chất là biểu đồ Stacked Bar, trong đó chuỗi dữ liệu bắt đầu (Start) được định dạng 'No Fill' để ẩn đi, chỉ để lại phần
    thời lượng.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 659–663
- id: n3074957937
  app: excel
  topic: Biểu đồ hình tròn
  fact: Nên tránh sử dụng biểu đồ tròn 3D vì hiệu ứng này thường làm méo mó hình ảnh dữ liệu, gây khó khăn cho việc so sánh chính xác các phần
    của biểu đồ.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 631–638
- id: n3074955632
  app: excel
  topic: Biểu đồ kết hợp (Combo Chart)
  fact: 'Sử dụng biểu đồ kết hợp khi muốn so sánh hai chuỗi dữ liệu khác nhau (ví dụ: doanh số thực tế và mục tiêu) bằng cách hiển thị một chuỗi
    dưới dạng cột và chuỗi còn lại dưới dạng đường.'
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 623–630
- id: n3074964012
  app: excel
  topic: Biểu đồ Radar
  fact: 'Biểu đồ Radar là công cụ hiệu quả để so sánh và tóm tắt hiệu suất của các đối tượng dựa trên nhiều thuộc tính khác nhau (ví dụ: tốc độ,
    sức mạnh, sự nhanh nhẹn).'
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 639–643
- id: n3074964726
  app: excel
  topic: Biểu đồ Radar
  fact: Biểu đồ Radar rất hiệu quả để so sánh nhiều biến số so với một điểm trung tâm, nơi khoảng cách từ tâm thể hiện giá trị tốt hơn.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 644–649
- id: n3074982314
  app: excel
  topic: Biểu đồ Treemap và Sunburst
  fact: Treemap phù hợp để xem tỷ trọng các danh mục, trong khi Sunburst hiệu quả hơn khi cần hiển thị dữ liệu phân cấp sâu (nhiều tầng) mà không
    bị chồng chéo nhãn.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 669–675
- id: n3074980272
  app: excel
  topic: Biểu đồ Waterfall
  fact: Biểu đồ Waterfall rất hữu ích để minh họa quá trình thay đổi của một giá trị tổng thể, ví dụ như từ doanh thu trừ đi các chi phí để ra
    lợi nhuận cuối cùng.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 664–668
- id: n3074981665
  app: excel
  topic: Biểu đồ Waterfall
  fact: Sử dụng để hiển thị sự thay đổi tích lũy của giá trị; tính năng 'Set As Total' rất quan trọng để neo các cột tổng (như lợi nhuận) vào
    trục hoành.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 669–675
- id: n3075099482
  app: excel
  topic: Bootstrapping
  fact: Phương pháp này giúp mô phỏng sự phụ thuộc lẫn nhau giữa các loại tài sản bằng cách chọn lợi nhuận của tất cả các loại tài sản từ cùng
    một hàng dữ liệu lịch sử trong mỗi năm mô phỏng.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 962–965
- id: n3075040537
  app: excel
  topic: Các công cụ giải (Solving Methods)
  fact: Simplex LP dùng cho bài toán tuyến tính, GRG Nonlinear cho bài toán phi tuyến, và Evolutionary cho các hàm không trơn như IF, MAX, MIN.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 843–846
- id: n3075003241
  app: excel
  topic: Cài đặt Analysis ToolPak
  fact: Công cụ Data Analysis không có sẵn mặc định; bạn cần vào File > Options > Add-Ins, chọn Excel Add-Ins, nhấn Go và tích chọn Analysis ToolPak
    để kích hoạt.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 723–728
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 847–849
- id: n3008124562
  app: excel
  topic: Cài đặt Solver
  fact: Nếu không thấy Solver trong tab Data, bạn cần vào File > Options > Add-Ins để kích hoạt tiện ích này trước khi sử dụng.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 847–849
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 876–879
- id: n3075054892
  app: excel
  topic: Cài đặt Solver
  fact: Solver không được bật mặc định. Bạn cần vào File > Options > Add-Ins, chọn Excel Add-Ins trong mục Manage, bấm Go và tích chọn Solver
    Add-in để kích hoạt.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 876–879
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 892–895
- id: n3076108189
  app: excel
  topic: Cảnh báo khi thay đổi kích thước trường
  fact: Khi giảm kích thước trường (Field Size) của một cột đã có dữ liệu, hãy cẩn thận vì hệ thống có thể cảnh báo mất dữ liệu nếu giá trị hiện
    tại vượt quá giới hạn mới.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 194–197
- id: n3075156553
  app: excel
  topic: CHAR function
  fact: Hàm CHAR trong Excel được dùng để trả về ký tự tương ứng với mã số ASCII hoặc Unicode cụ thể, thường dùng để chèn các ký tự đặc biệt vào
    chuỗi văn bản.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 1101–1105
- id: n3076429402
  app: excel
  topic: Chế độ End
  fact: Nhấn phím End rồi nhấn phím mũi tên giúp di chuyển nhanh đến ô cuối cùng có dữ liệu trong hàng hoặc cột đó.
  sources:
  - Keyboard shortcuts in Excel | Microsoft Support, https://support.microsoft.com/en-us/accessibility/excel/keyboard-shortcuts-in-excel
- id: n3074978519
  app: excel
  topic: Chèn đường kẻ dọc vào biểu đồ
  fact: Để chèn đường kẻ dọc cố định vào biểu đồ, hãy tạo một chuỗi dữ liệu mới với tọa độ X là ngày tháng và tọa độ Y là khoảng giá trị, sau
    đó copy và dán chuỗi này vào biểu đồ thay vì vẽ hình thủ công.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 664–668
- id: n3075148142
  app: excel
  topic: Chia sẻ hàm LAMBDA
  fact: Để sử dụng hàm LAMBDA đã tạo trong một file Excel khác, bạn chỉ cần sao chép ô có chứa công thức sử dụng hàm đó sang file mới.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 1079–1083
- id: n3075129406
  app: excel
  topic: Chiến lược định giá
  fact: Định giá theo gói (Bundling) thường hiệu quả nhất khi giá trị mà khách hàng đặt cho các sản phẩm trong gói có tương quan nghịch với nhau.

  fact: Sử dụng Format Painter giúp bạn sao chép nhanh kiểu chữ, màu sắc và định dạng đoạn từ một vị trí sang vị trí khác mà không cần chỉnh sửa
    thủ công từng thuộc tính.
  sources:
  - Bai tap Tin hoc FTU2.pdf, trang 15–18

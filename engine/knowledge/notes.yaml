  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 9–19
- id: n3076112513
  app: word
  topic: Kiểm tra lỗi tự động
  fact: Microsoft Office có tính năng tự động kiểm tra lỗi (như báo cáo vượt quá khổ giấy in) và bật mặc định; bạn có thể tắt tính năng này trong
    phần Options của ứng dụng.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 209–215

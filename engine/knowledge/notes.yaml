  app: excel
  topic: Tạo bảng mới từ bảng cũ
  fact: Khi cần tạo một bảng có cấu trúc tương tự bảng đã có, việc sao chép và chỉ giữ lại cấu trúc (không lấy dữ liệu) sẽ tiết kiệm thời gian

  fact: Khi ghi macro mặc định, Excel sử dụng tham chiếu tuyệt đối, nghĩa là macro sẽ luôn thực hiện thao tác tại đúng địa chỉ ô bạn đã chọn lúc
    ghi (ví dụ luôn là A1, B1), bất kể bạn đang chọn ô nào khi chạy macro.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 1060–1065

  fact: Sử dụng Ctrl+N để mở file mới, Ctrl+O để mở file cũ, Ctrl+S để lưu và Ctrl+P để in giúp thao tác nhanh hơn thay vì dùng chuột.
  sources:
  - Bai tap Tin hoc FTU2.pdf, trang 38–42
- id: n3076655192
  app: word
  topic: Phím tắt Ribbon
  fact: Bạn có thể nhấn phím Alt để hiển thị các phím truy cập nhanh (Key Tips) cho các tab trên thanh Ribbon, giúp điều hướng mà không cần dùng
    chuột.
  sources:
  - Keyboard shortcuts in Word | Microsoft Support, https://support.microsoft.com/en-us/accessibility/word/keyboard-shortcuts-in-word
- id: n2949686290
  app: word
  topic: Print Options
  fact: Print dialog in File tab allows landscape/portrait, double-sided, paper size, and printer selection.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf · trang 13–20

  fact: Word dùng gạch chân màu đỏ cho lỗi chính tả, màu xanh lá cho lỗi ngữ pháp và màu xanh dương cho lỗi dùng từ sai ngữ cảnh; bạn có thể chuột
    phải vào từ đó để xem gợi ý sửa.

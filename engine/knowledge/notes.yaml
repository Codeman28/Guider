  app: excel
  topic: Tham chiếu tuyệt đối
  fact: Khi tính toán chỉ số mùa vụ, hãy sử dụng dấu $ (ví dụ $K$2) để cố định ô tham chiếu, giúp công thức không bị thay đổi khi sao chép sang

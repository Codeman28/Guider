  fact: Thay vì nhấn phím Enter nhiều lần để tạo khoảng cách, hãy sử dụng thiết lập Before/After trong hộp thoại Paragraph để kiểm soát khoảng
    cách giữa các đoạn văn bản một cách chuyên nghiệp.

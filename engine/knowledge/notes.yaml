  app: excel
  topic: Tính linh hoạt của Macro
  fact: Khi ghi macro, nếu chỉ sử dụng địa chỉ tuyệt đối, macro sẽ không hoạt động chính xác nếu số lượng hàng hoặc cột dữ liệu thay đổi; cần
    kết hợp địa chỉ tương đối để macro linh hoạt hơn.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 1066–1070
- id: n3076423777
  app: excel
  topic: Tính toán lại bảng tính
  fact: Nhấn F9 để tính toán lại tất cả các công thức trong toàn bộ workbook, giúp cập nhật dữ liệu mới nhất nếu chế độ tính toán tự động bị tắt.
  sources:
  - Keyboard shortcuts in Excel | Microsoft Support, https://support.microsoft.com/en-us/accessibility/excel/keyboard-shortcuts-in-excel
- id: n3074999871
  app: excel
  topic: Toán tử lũy thừa
  fact: 'Trong Excel, sử dụng ký hiệu dấu mũ (^) để tính lũy thừa, ví dụ: C4^-0.2533 nghĩa là lấy giá trị ô C4 mũ -0.2533.'
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 719–722
- id: n3076086324
  app: excel
  topic: Toàn vẹn dữ liệu
  fact: Việc thiết lập các quy tắc xác thực (validation rules) và giới hạn định dạng dữ liệu giúp đảm bảo thông tin nhập vào hệ thống luôn chính
    xác và nhất quán.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 147–149
- id: n3076109289
  app: excel
  topic: Toàn vẹn tham chiếu (Referential Integrity)
  fact: Khi thiết lập mối quan hệ, bạn có thể bật tính năng toàn vẹn tham chiếu để đảm bảo dữ liệu không được phép nhập vào bảng này nếu nó chưa
    tồn tại trong bảng liên kết.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 198–201
- id: n3076110377
  app: excel
  topic: Toàn vẹn tham chiếu (Referential Integrity)
  fact: 'Khi thiết lập mối quan hệ, việc chọn ''Enforce Referential Integrity'' giúp đảm bảo dữ liệu nhập vào bảng con (ví dụ: Orders) phải tồn
    tại trong bảng cha (ví dụ: Customers), ngăn chặn lỗi dữ liệu không khớp.'
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 202–208
- id: n3075090067
  app: excel
  topic: Tối ưu hóa bảng tính
  fact: Sử dụng chế độ 'Automatic Except for Tables' giúp ngăn các bảng dữ liệu lớn tự động tính toán lại, tránh gây chậm máy khi bạn đang nhập
    liệu.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 948–951
- id: n3074958586
  app: excel
  topic: Tối ưu hóa biểu đồ tròn
  fact: Khi có quá nhiều danh mục, biểu đồ tròn dễ bị rối; sử dụng loại biểu đồ 'Bar of Pie' giúp tách các danh mục có giá trị nhỏ ra một biểu
    đồ cột phụ để dễ quan sát hơn.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 631–638
- id: n3075126263
  app: excel
  topic: Tối ưu hóa lợi nhuận
  fact: Khi bán các sản phẩm đi kèm (như lưỡi dao cho dao cạo), việc tính toán lợi nhuận cần bao gồm cả lợi nhuận từ sản phẩm phụ để tránh định
    giá sai sản phẩm chính.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 1027–1031
- id: n3075059654
  app: excel
  topic: Tối ưu hóa với Solver
  fact: Công cụ Solver rất hữu ích để tối thiểu hóa sai số bằng cách thay đổi các biến số đầu vào (như xếp hạng đội bóng) cho đến khi đạt được
    kết quả mục tiêu mong muốn.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 884–887
- id: n3076112001
  app: excel
  topic: Tóm tắt dữ liệu số
  fact: Khi tạo báo cáo, bạn có thể bấm vào Summary Options để tính tổng, trung bình, giá trị lớn nhất hoặc nhỏ nhất cho các trường dữ liệu số.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 209–215
- id: n3075155972
  app: excel
  topic: Trace Precedents
  fact: Tính năng Trace Precedents giúp bạn trực quan hóa các ô dữ liệu đầu vào đang được sử dụng trong công thức tại ô hiện tại, rất hữu ích
    để kiểm tra lỗi logic.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 1101–1105
- id: n3074967002
  app: excel
  topic: Tránh gây hiểu lầm biểu đồ
  fact: Việc tự ý thay đổi phạm vi trục tung (cắt bỏ phần dưới) có thể làm sai lệch cảm nhận về tốc độ tăng trưởng, nên luôn kiểm tra kỹ trước
    khi trình bày.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 644–649
- id: n3074955033
  app: excel
  topic: Trục phụ (Secondary Axis)
  fact: Khi biểu đồ chứa hai loại dữ liệu có quy mô (magnitude) khác biệt lớn, hãy sử dụng trục phụ để đảm bảo cả hai chuỗi dữ liệu đều hiển thị
    rõ ràng và dễ so sánh.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 623–630
- id: n3074954150
  app: excel
  topic: Trực quan hóa biểu đồ
  fact: Bạn có thể thay thế các cột mặc định trong biểu đồ bằng hình ảnh để làm nổi bật sản phẩm, giúp người xem dễ hình dung dữ liệu hơn so với
    biểu đồ cột thông thường.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 617–622
- id: n3075028636
  app: excel
  topic: Trung bình trượt (Moving Average)
  fact: Sử dụng trung bình trượt giúp loại bỏ các biến động ngẫu nhiên và ảnh hưởng theo mùa, từ đó làm rõ xu hướng thực sự của dữ liệu theo thời
    gian.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 781–784
- id: n3076085818
  app: excel
  topic: Truy vấn dữ liệu
  fact: Trong Access, bạn có thể sử dụng các truy vấn (queries) để tự động hóa việc tính toán, cập nhật hoặc xóa các bản ghi dữ liệu thay vì thao
    tác thủ công.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 147–149
- id: n3075037659
  app: excel
  topic: Tự động cập nhật dữ liệu
  fact: Sử dụng hàm TODAY() làm tham số ngày kết thúc (end_date) để đảm bảo bảng dữ liệu luôn hiển thị thông tin mới nhất.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 833–836
- id: n3074993438
  app: excel
  topic: Tự động cập nhật dữ liệu Sparkline
  fact: Để Sparkline tự động cập nhật khi có dữ liệu mới, hãy chuyển đổi vùng dữ liệu thành Table hoặc sử dụng dải dữ liệu động (Dynamic Range).
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 696–700
- id: n3075134179
  app: excel
  topic: Tương tác với Analyze Data
  fact: Bạn có thể đặt câu hỏi trực tiếp về dữ liệu trong ô 'Ask a Question About Your Data' hoặc chọn các gợi ý có biểu tượng bóng đèn để Excel
    tự động tạo PivotTable hoặc biểu đồ.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 1048–1055
- id: n3074968781
  app: excel
  topic: Tùy biến biểu tượng
  fact: Khi dùng phông chữ Wingdings 3 để làm biểu tượng, bạn có thể dễ dàng thay đổi điều kiện hiển thị bằng cách lồng ghép các hàm IF trong
    công thức Excel.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 650–655
- id: n3074970646
  app: excel
  topic: Tùy chỉnh biểu đồ
  fact: Bạn có thể điều chỉnh độ rộng của các cột trong biểu đồ bằng cách thay đổi thông số 'Gap Width' trong bảng 'Format Data Series'.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 656–658
- id: n3075135421
  app: excel
  topic: Tùy chỉnh biểu đồ
  fact: Việc điều chỉnh giới hạn trục (axis limits) của biểu đồ scatter giúp làm nổi bật các vùng dữ liệu quan trọng và loại bỏ các khoảng trống
    không cần thiết, giúp biểu đồ dễ đọc hơn.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 1048–1055
- id: n3074986301
  app: excel
  topic: Tùy chỉnh biểu đồ bản đồ
  fact: Bạn có thể chuyển đổi giữa các kiểu chiếu bản đồ như Mercator, Miller hoặc Robinson để thay đổi cách hiển thị thế giới trên biểu đồ.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 676–681
- id: n3074989415
  app: excel
  topic: Tùy chỉnh Data Card
  fact: Khi di chuột qua các thanh dữ liệu trên bản đồ 3D, bạn có thể nhấn vào biểu tượng bánh răng trên thẻ thông tin để tùy chỉnh các trường
    dữ liệu hiển thị.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 682–688
- id: n3076091185
  app: excel
  topic: Tùy chỉnh hiển thị Ribbon
  fact: Nếu bạn không thấy nút lệnh như hướng dẫn, hãy kiểm tra xem nhóm lệnh đó có bị thu gọn không; bạn có thể cần bấm vào nút đại diện của
    nhóm để mở rộng các lệnh bên trong.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 159–163
- id: n3074959158
  app: excel
  topic: Tùy chỉnh ngưỡng tách dữ liệu
  fact: 'Trong cài đặt ''Format Data Series'', bạn có thể thiết lập ngưỡng phần trăm (ví dụ: dưới 4%) để tự động chuyển các danh mục nhỏ vào biểu
    đồ cột phụ.'
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 631–638
- id: n3075038292
  app: excel
  topic: Tùy chỉnh tiêu đề
  fact: Khi thiết lập tham số header là 0, Excel sẽ không tự tạo tiêu đề, bạn cần phải tự nhập tiêu đề cho các cột dữ liệu theo cách thủ công.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 833–836
- id: n3075150807
  app: excel
  topic: Ứng dụng của LAMBDA helper
  fact: Bạn có thể sử dụng các hàm này để thực hiện tính toán trên từng phần tử của mảng, tạo mảng mới hoặc tích lũy giá trị, thay thế cho các
    công thức mảng truyền thống khó quản lý.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 1084–1088
- id: n3074992853
  app: excel
  topic: Ứng dụng Win/Loss Sparklines
  fact: Biểu đồ Win/Loss rất hữu ích để theo dõi tiến độ đạt mục tiêu hoặc hạn mức của tổ chức.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 696–700
- id: n3075143056
  app: excel
  topic: Use Relative References
  fact: 'Khi ghi macro, hãy bật tính năng này nếu bạn muốn macro thực hiện thao tác dựa trên vị trí tương đối của ô hiện tại thay vì ghi lại địa
    chỉ ô cố định (ví dụ: A1). Điều này cực kỳ quan trọng để macro hoạt động đúng trên các bảng dữ liệu có số lượng dòng thay đổi.'
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 1071–1074
- id: n3075144250
  app: excel
  topic: Value Filters
  fact: Tính năng Value Filters trong PivotTable rất mạnh mẽ để lọc dữ liệu dựa trên các giá trị số, cho phép bạn nhanh chóng tìm ra các mục hàng
    đầu (Top N) hoặc các mục vượt quá một ngưỡng nhất định.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 1071–1074
- id: n3075122088
  app: excel
  topic: Vẽ biểu đồ Scatter
  fact: Khi vẽ biểu đồ Scatter từ dữ liệu ít điểm, Excel có thể tự động hiểu sai cấu trúc dữ liệu (hàng thành cột). Nếu biểu đồ hiển thị không
    đúng ý muốn, hãy sử dụng tính năng Switch Row/Column trong tab Chart Design để khắc phục.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 1019–1022
- id: n3075192052
  app: excel
  topic: VLOOKUP
  fact: 'Hàm VLOOKUP thường gây ra lỗi #N/A nếu không tìm thấy giá trị, hãy cân nhắc sử dụng XLOOKUP nếu phiên bản Excel của bạn hỗ trợ để linh
    hoạt hơn.'
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 1230–1235
- id: n3075141632
  app: excel
  topic: Xem mã VBA của Macro
  fact: Bạn có thể kiểm tra mã nguồn của macro bằng cách vào tab Developer, chọn Macros, chọn tên macro và nhấn Edit để mở trình soạn thảo VBA.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 1060–1065
- id: n3075118032
  app: excel
  topic: XNPV
  fact: Sử dụng hàm XNPV thay vì NPV thông thường khi các dòng tiền của dự án không xảy ra theo các khoảng thời gian đều đặn.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 999–1002
- id: n3074956762
  app: excel
  topic: Xử lý dữ liệu thiếu trong biểu đồ
  fact: Excel cho phép bạn tùy chỉnh cách hiển thị dữ liệu bị thiếu trong biểu đồ, bao gồm việc coi đó là số 0, để trống hoặc nối các điểm dữ
    liệu liền kề bằng đường thẳng để biểu đồ trông liền mạch hơn.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 623–630
- id: n3074976441
  app: excel
  topic: Xử lý giá trị trùng lặp trong xếp hạng
  fact: Hàm RANK sẽ trả về cùng một thứ hạng nếu các giá trị bằng nhau; để tạo thứ hạng duy nhất, hãy cộng thêm kết quả của hàm COUNTIF với vùng
    tham chiếu mở rộng (ví dụ $G$1:G1) để đếm số lần xuất hiện của giá trị đó.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 659–663
- id: n3075072309
  app: excel
  topic: Xử lý giới hạn trong Solver
  fact: Nếu kết quả của Solver chạm vào các giới hạn trên hoặc dưới đã thiết lập, bạn nên nới lỏng các giới hạn này để Solver có không gian tìm
    kiếm nghiệm chính xác hơn.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 914–920
- id: n3075074561
  app: excel
  topic: Xử lý ràng buộc
  fact: Vì Evolutionary Solver không xử lý tốt các ràng buộc phi tuyến tính, bạn nên đưa các ràng buộc đó vào hàm mục tiêu dưới dạng hình phạt
    (penalty) để loại bỏ các nghiệm vi phạm.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 921–924
- id: n3075058088
  app: excel
  topic: Xử lý sai số trong mô hình tối ưu hóa
  fact: Khi tối ưu hóa dữ liệu, nên bình phương sai số (Actual - Predicted)^2 thay vì chỉ lấy hiệu số, để tránh việc các sai số dương và âm triệt
    tiêu lẫn nhau.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 884–887
- id: n3076448323
  app: excel
  topic: Xử lý xung đột phím tắt
  fact: Khi dùng Excel trên trình duyệt web, bạn có thể vào mục Help > Keyboard Shortcuts để ghi đè các phím tắt của trình duyệt, giúp trải nghiệm
    giống như trên ứng dụng desktop.
  sources:
  - Keyboard shortcuts in Excel | Microsoft Support, https://support.microsoft.com/en-us/accessibility/excel/keyboard-shortcuts-in-excel
- id: n3076088892
  app: excel
  topic: Xuất file PDF
  fact: Việc xuất file sang định dạng PDF hoặc XPS là lựa chọn tối ưu khi bạn muốn chia sẻ báo cáo mà không muốn người nhận thay đổi nội dung
    dữ liệu.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 154–158
- id: n3076432347
  app: excel
  topic: Xung đột phím tắt
  fact: Một số phím tắt trên Windows có thể trùng với phím tắt hệ thống của macOS, bạn có thể cần thay đổi cài đặt bàn phím trong System Settings
    nếu phím tắt không hoạt động.
  sources:
  - Keyboard shortcuts in Excel | Microsoft Support, https://support.microsoft.com/en-us/accessibility/excel/keyboard-shortcuts-in-excel
- id: n3075019833
  app: excel
  topic: Ý nghĩa của ANOVA
  fact: Dù mục tiêu là so sánh trung bình các nhóm, kỹ thuật này được gọi là phân tích phương sai vì nó so sánh sự biến thiên giữa các nhóm với
    sự biến thiên trong nội bộ từng nhóm.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 763–767
- id: n3075024424
  app: excel
  topic: Ý nghĩa của ANOVA
  fact: Phân tích phương sai (ANOVA) giúp xác định xem các yếu tố khác nhau (như khu vực hoặc nhân viên bán hàng) có thực sự tác động đáng kể
    đến kết quả kinh doanh hay không.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 771–775
- id: n3075023836
  app: excel
  topic: Ý nghĩa của Two-Way ANOVA
  fact: Phương pháp này dùng khi bạn muốn kiểm tra tác động của hai yếu tố khác nhau lên một kết quả duy nhất, ví dụ như xem xét cả nhân viên
    bán hàng và khu vực địa lý ảnh hưởng thế nào đến doanh số.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 768–770
- id: n3075026064
  app: excel
  topic: Yêu cầu dữ liệu cho Anova hai yếu tố
  fact: Khi thực hiện Anova hai yếu tố có lặp lại, Excel bắt buộc bạn phải đặt nhãn cho các mức độ của cột ở hàng đầu tiên và nhãn cho các mức
    độ của dòng ở cột đầu tiên trong phạm vi dữ liệu đầu vào.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 771–775
- id: n3076083531
  app: powerpoint
  topic: Ẩn biểu tượng âm thanh
  fact: Bạn có thể tích chọn 'Hide During Show' trong tab Playback để ẩn biểu tượng loa khi trình chiếu, giúp slide trông chuyên nghiệp hơn.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 134–137
- id: n3076090667
  app: powerpoint
  topic: Ảnh hưởng của độ phân giải và DPI
  fact: Độ phân giải màn hình càng cao thì Ribbon hiển thị được càng nhiều nút lệnh; ngược lại, tăng tỉ lệ phóng đại (DPI) của Windows sẽ làm
    các phần tử giao diện to hơn nhưng khiến ít nội dung hiển thị được trên màn hình hơn.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 159–163
- id: n3076069308
  app: powerpoint
  topic: Backstage View
  fact: Bạn có thể truy cập tất cả các công cụ quản lý tệp tin (lưu, in, chia sẻ) tại một nơi duy nhất bằng cách nhấn vào tab File.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 78–81
- id: n3072983863
  app: powerpoint
  topic: Căn chỉnh
  fact: Luôn bật Ruler và Gridlines khi thiết kế để đảm bảo các đối tượng trên slide được căn thẳng hàng và cân đối.
  sources:
  - Bai tap Tin hoc FTU2.pdf, trang 102–109
- id: n3076078453
  app: powerpoint
  topic: Căn chỉnh ảnh
  fact: Khi thay đổi kích thước ảnh, hãy chú ý các đường hướng dẫn (dotted guide) xuất hiện để căn chỉnh ảnh này thẳng hàng với ảnh khác trên
    slide.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 105–110
- id: n3072983398
  app: powerpoint
  topic: Chế độ hiển thị
  fact: Sử dụng chế độ Slide Sorter rất hữu ích khi bạn cần sắp xếp lại thứ tự các slide trong bài thuyết trình.
  sources:
  - Bai tap Tin hoc FTU2.pdf, trang 102–109
- id: n3076084200
  app: powerpoint
  topic: Chèn video từ web
  fact: Bạn có thể chèn video từ trang web bằng cách sử dụng mã nhúng (embed code) thông qua tùy chọn Video From Web Site trong tab Insert.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 138–146
- id: n3076081023
  app: powerpoint
  topic: Chọn thành phần biểu đồ
  fact: Nếu khó chọn chính xác một thành phần biểu đồ bằng chuột, bạn có thể sử dụng danh sách thả xuống 'Chart Elements' trong nhóm 'Current
    Selection' trên tab Format để chọn nhanh.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 116–121
- id: n3076080484
  app: powerpoint
  topic: Chọn thành phần nhỏ
  fact: Nếu các thành phần biểu đồ quá nhỏ hoặc khó chọn bằng chuột, hãy sử dụng danh sách Chart Elements trong tab Format để chọn chính xác đối
    tượng cần chỉnh sửa.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 111–115
- id: n3072987069
  app: powerpoint
  topic: Chuyển đổi slide khi đang trình chiếu
  fact: Khi đang trình chiếu, bạn có thể nhấn Alt + Tab để chuyển nhanh sang cửa sổ ứng dụng khác mà không cần kết thúc bài thuyết trình.
  sources:
  - Bai tap Tin hoc FTU2.pdf, trang 114–116
- id: n2948633765
  app: powerpoint
  topic: Create a Document
  fact: Tạo bài thuyết trình mới bằng cách chọn Home > New > Blank Presentation. Đây là cách cơ bản để bắt đầu một bài thuyết trình PowerPoint.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf · trang 1–4
- id: n3086641746
  app: powerpoint
  topic: Điều hướng vùng làm việc
  fact: Sử dụng phím Ctrl+F6 để di chuyển tới lui giữa các vùng như ribbon, ngăn hình thu nhỏ và khung slide mà không cần dùng chuột.
  sources:
  - Use keyboard shortcuts to create PowerPoint presentations | Microsoft Support, https://support.microsoft.com/en-us/accessibility/powerpoint/use-keyboard-shortcuts-to-create-powerpoint-presentations
- id: n3076079980
  app: powerpoint
  topic: Định dạng nhanh
  fact: Bạn có thể nhấp đúp chuột vào bất kỳ thành phần nào của biểu đồ để mở nhanh bảng tùy chọn định dạng cho thành phần đó.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 111–115
- id: n3086629433
  app: powerpoint
  topic: Định dạng nhanh
  fact: Sử dụng các tổ hợp phím như Ctrl+B, Ctrl+I, Ctrl+U giúp áp dụng nhanh định dạng đậm, nghiêng, gạch chân cho văn bản đã chọn.
  sources:

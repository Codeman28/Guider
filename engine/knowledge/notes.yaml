  topic: Quản lý hình ảnh
  fact: Việc sử dụng tính năng Insert Caption giúp Word tự động cập nhật số thứ tự hình ảnh khi bạn thêm hoặc xóa hình, rất hữu ích khi làm báo
    cáo dài.
  sources:
  - Bai tap Tin hoc FTU2.pdf, trang 27–33
- id: n3076667597
  app: word
  topic: Quản lý ký tự đặc biệt
  fact: Bạn có thể chèn các ký tự đặc biệt như dấu gạch ngang (em dash, en dash) hoặc ký hiệu bản quyền bằng các tổ hợp phím tắt thay vì phải
    mở bảng Symbol.
  sources:
  - Keyboard shortcuts in Word | Microsoft Support, https://support.microsoft.com/en-us/accessibility/word/keyboard-shortcuts-in-word
- id: n2948748793
  app: word
  topic: Quick Access Toolbar
  fact: Quick Access Toolbar có thể được tùy chỉnh để thêm các lệnh thường dùng, giúp tiết kiệm thời gian khi làm việc với Word.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf · trang 1–4
- id: n2950502926
  app: word
  topic: Quick Access Toolbar
  fact: Bạn có thể truy cập nhanh các chức năng thường dùng qua Quick Access Toolbar (thêm vào thanh công cụ trên cùng của cửa sổ Word).
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf · trang 21–25
- id: n3076056124
  app: word
  topic: Quick Access Toolbar
  fact: Bạn có thể tùy chỉnh thanh công cụ này để thêm bất kỳ lệnh nào bạn hay sử dụng, giúp tiết kiệm thời gian so với việc tìm kiếm trong menu
    File.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 1–8
- id: n3076074025
  app: word
  topic: Quy ước trình bày
  fact: Các từ in đậm màu đen thường chỉ tên các nút, lệnh hoặc hộp thoại, trong khi văn bản in đậm màu xanh dương là nội dung bạn cần nhập trực
    tiếp vào tài liệu.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 91–96
- id: n3076093240
  app: word
  topic: Quy ước trình bày
  fact: Các từ in đậm trong hướng dẫn thường chỉ tên các nút bấm, lệnh, cửa sổ hoặc văn bản cụ thể mà bạn cần nhập liệu.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 164–168
- id: n3072961055
  app: word
  topic: Repeat Action
  fact: Phím F4 rất hữu ích để lặp lại lệnh vừa thực hiện, giúp tiết kiệm thời gian đáng kể khi cần định dạng nhiều đoạn văn hoặc tiêu đề giống
    nhau.
  sources:
  - Bai tap Tin hoc FTU2.pdf, trang 43–46
- id: n2948748760
  app: word
  topic: Ribbon
  fact: Trong Word 2010, Ribbon thay thế Command Line, giúp truy cập nhanh các tính năng thông qua các tab như File, Home, Insert, v.v.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf · trang 1–4
- id: n3076094801
  app: word
  topic: ScreenTip
  fact: Tính năng ScreenTip giúp người dùng nhanh chóng nhận diện công dụng của các công cụ trên giao diện mà không cần mở tài liệu hướng dẫn.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 164–168
- id: n2950952261
  app: word
  topic: Spelling & Grammar Check
  fact: Spelling & Grammar check is an automated process that goes through the entire document. It's useful for catching errors before finalizing
    the document.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf · trang 26–32
- id: n2948987887
  app: word
  topic: Spelling and Grammar
  fact: Word's spelling checks are generally accurate but grammar suggestions may require manual review. Right-clicking a word allows ignoring
    suggested revisions and removing underlines.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf · trang 5–12
- id: n3076674730
  app: word
  topic: Spike
  fact: Spike là một tính năng đặc biệt cho phép bạn cắt nhiều đoạn văn bản hoặc hình ảnh khác nhau vào một bộ nhớ tạm, sau đó dán tất cả chúng
    cùng lúc vào vị trí mới bằng Ctrl+Shift+F3.
  sources:
  - Keyboard shortcuts in Word | Microsoft Support, https://support.microsoft.com/en-us/accessibility/word/keyboard-shortcuts-in-word
- id: n3072755961
  app: word
  topic: Sử dụng Heading
  fact: Nên sử dụng các cấp độ Heading (Heading 1, Heading 2...) thay vì chỉ tăng cỡ chữ thủ công để Word tự động nhận diện cấu trúc tài liệu,
    giúp việc tạo mục lục tự động sau này dễ dàng hơn.
  sources:
  - Bai01.docx, đoạn 1
  - Bai05.docx, đoạn 1
- id: n3076091695
  app: word
  topic: Sử dụng ScreenTips
  fact: Khi không chắc chắn về một nút lệnh, hãy di chuyển con trỏ chuột vào nút đó để xem tên lệnh hiển thị trong ScreenTip.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 159–163
- id: n3072787816
  app: word
  topic: Sử dụng Styles
  fact: Đối với các văn bản có cấu trúc như đơn đăng ký, hãy sử dụng các kiểu Heading (Heading 1, Heading 2) để quản lý tiêu đề, giúp việc định
    dạng đồng bộ và dễ dàng thay đổi sau này.
  sources:
  - Bai09.docx, đoạn 1
- id: n3076701461
  app: word
  topic: Sự khác biệt giữa các phiên bản
  fact: Phím tắt trên Word cho web có thể khác với phiên bản cài đặt trên máy tính, hãy lưu ý môi trường làm việc của bạn.
  sources:
  - Keyboard shortcuts in Word | Microsoft Support, https://support.microsoft.com/en-us/accessibility/word/keyboard-shortcuts-in-word
- id: n2950607309
  app: word
  topic: Table of Contents
  fact: Để tạo Table of Contents, cần dùng heading styles cho các mục cần bao gồm. Chọn Automatic Table 2 để tạo bảng mục lục tự động.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf · trang 21–25
- id: n3076697239
  app: word
  topic: Tăng tốc độ làm việc
  fact: Sử dụng phím tắt thay vì chuột giúp thao tác chỉnh sửa và định dạng văn bản nhanh hơn đáng kể.
  sources:
  - Keyboard shortcuts in Word | Microsoft Support, https://support.microsoft.com/en-us/accessibility/word/keyboard-shortcuts-in-word
- id: n2948906590
  app: word
  topic: Tạo tài liệu
  fact: Bạn có thể tạo tài liệu từ mẫu (templates) qua File > New > Templates, hoặc từ Internet (nếu có kết nối).
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf · trang 5–12
- id: n2949686089
  app: word
  topic: Text Alignment
  fact: Center alignment is useful for titles or headings; Justify aligns text to both margins for clean layouts.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf · trang 13–20
- id: n2949686133
  app: word
  topic: Text Color
  fact: Font Color and Text Highlight Color are separate features; highlight color changes text background.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf · trang 13–20
- id: n3072962590
  app: word
  topic: Thao tác bảng
  fact: Để thêm nhanh một dòng vào cuối bảng, bạn chỉ cần đặt con trỏ ở ô cuối cùng và nhấn phím Tab.
  sources:
  - Bai tap Tin hoc FTU2.pdf, trang 47–50
- id: n3076669340
  app: word
  topic: Thao tác với bảng
  fact: Khi làm việc trong bảng, phím Tab giúp di chuyển sang ô kế tiếp, trong khi Shift+Tab giúp quay lại ô trước đó, giúp thao tác nhập liệu
    nhanh hơn.
  sources:
  - Keyboard shortcuts in Word | Microsoft Support, https://support.microsoft.com/en-us/accessibility/word/keyboard-shortcuts-in-word
- id: n3076059485
  app: word
  topic: Thay đổi kích thước đối tượng
  fact: Sau khi chèn hình ảnh hoặc hình khối, bạn có thể thay đổi kích thước bằng cách kéo các vòng tròn nhỏ ở góc đối tượng.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 20–27
- id: n3076118578
  app: word
  topic: Thiết kế báo cáo
  fact: Khi thiết kế báo cáo, hãy tập trung vào mục tiêu truyền tải thông tin, đối tượng người đọc và mức độ chi tiết cần thiết để báo cáo hiệu
    quả hơn.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 221–225
- id: n3076054731
  app: word
  topic: Thu gọn Ribbon
  fact: Có thể thu gọn Ribbon bằng cách nhấp vào mũi tên hướng lên ở góc phải để tăng không gian hiển thị tài liệu khi đọc.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 1–8
- id: n2944326971
  app: word
  topic: Thụt lề đoạn văn
  fact: Nhấn Decrease Indent để đưa đoạn văn ra lại
  sources:
  - meo_office.md · đoạn 1
- id: n3072956051
  app: word
  topic: Thụt lề văn bản
  fact: Sử dụng Ctrl+M để tăng thụt lề và Ctrl+Shift+M để giảm thụt lề nhanh chóng thay vì dùng chuột.
  sources:
  - Bai tap Tin hoc FTU2.pdf, trang 23–26
- id: n3076071837
  app: word
  topic: Tìm kiếm lệnh
  fact: Nếu không tìm thấy nút lệnh như hướng dẫn, hãy di chuột vào các biểu tượng để xem tên công cụ (ScreenTip) hoặc kiểm tra xem nhóm lệnh
    đó có đang bị thu gọn hay không.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 86–90
- id: n3076699506
  app: word
  topic: Tìm kiếm lệnh
  fact: Nếu quên phím tắt, bạn có thể sử dụng tính năng tìm kiếm (Alt+Q) để truy cập nhanh các lệnh trên thanh Ribbon.
  sources:
  - Keyboard shortcuts in Word | Microsoft Support, https://support.microsoft.com/en-us/accessibility/word/keyboard-shortcuts-in-word
- id: n3076704403
  app: word
  topic: Tìm kiếm lệnh
  fact: Sử dụng phím Alt+Q để mở nhanh ô tìm kiếm (Tell Me) giúp bạn tìm và thực hiện lệnh mà không cần lục tìm trên thanh Ribbon.
  sources:
  - Keyboard shortcuts in Word | Microsoft Support, https://support.microsoft.com/en-us/accessibility/word/keyboard-shortcuts-in-word
- id: n3072964531
  app: word
  topic: Tính toán trong bảng
  fact: Bảng trong Word hỗ trợ các hàm cơ bản như AVERAGE, SUM, tương tự như cách hoạt động trong Excel.
  sources:
  - Bai tap Tin hoc FTU2.pdf, trang 47–50
- id: n3076090127
  app: word
  topic: Tối ưu hóa không gian Ribbon
  fact: Nếu Ribbon bị thu hẹp quá mức, hãy tìm mũi tên cuộn ở phía bên phải để truy cập các nhóm lệnh đang bị ẩn.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 159–163
- id: n3076060425
  app: word
  topic: Tra cứu từ vựng
  fact: Trong tab Review, bạn có thể dùng tính năng Thesaurus để tìm từ đồng nghĩa hoặc Research để tra cứu từ vựng đã chọn.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 20–27
- id: n3072960671
  app: word
  topic: Track Changes
  fact: Phím tắt Ctrl+Shift+E là cách nhanh nhất để bật hoặc tắt chế độ theo dõi thay đổi, giúp bạn kiểm soát các chỉnh sửa trong văn bản khi
    làm việc nhóm.
  sources:
  - Bai tap Tin hoc FTU2.pdf, trang 43–46
- id: n3076087330
  app: word
  topic: Tùy chỉnh Ribbon
  fact: Người dùng có thể tự tạo các thẻ (tabs) và nhóm (groups) riêng trên thanh Ribbon để sắp xếp các công cụ thường dùng theo quy trình làm
    việc cá nhân, giúp thao tác nhanh hơn.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 150–153
- id: n2944326942
  app: word
  topic: Viết chỉ số trên (mũ)
  fact: 'Phím tắt: Ctrl+Shift+='
  sources:
  - meo_office.md · đoạn 1
- id: n3072950510
  app: word
  topic: Windows Explorer
  fact: Đây là công cụ quản lý tệp tin và thư mục, giúp người dùng xem cấu trúc cây của máy tính và quản lý dữ liệu.
  sources:
  - Bai tap Tin hoc FTU2.pdf, trang 6–9
- id: n2950952327
  app: word
  topic: Word Count
  fact: Word Count provides statistics for pages, words, paragraphs, lines, etc. It's helpful for tracking document length and ensuring content
    meets requirements.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf · trang 26–32
- id: n3076118052
  app: word
  topic: Xem trước khi in
  fact: Luôn kiểm tra báo cáo ở chế độ Print Preview trước khi in thực tế để phát hiện sớm các lỗi về bố cục hoặc trang thừa.
  sources:
  - 1702861677MICROSOFT-OFFICE-BOOK.pdf, trang 221–225
- id: n3074823033
  app: word
  topic: Xử lý dữ liệu trước khi nhập
  fact: Thay thế các cụm từ chứa khoảng trắng bằng từ đơn trước khi lưu giúp tránh việc dữ liệu bị chia tách sai cột khi nhập vào Excel.
  sources:
  - Microsoft.Press.Microsoft.Excel.Data.Analysis.and.Business.Modeling.7th.Edition (1).pdf, trang 336–338
- id: n3076684936
  app: word
  topic: Xung đột phím tắt
  fact: Trên macOS, một số phím tắt của Word có thể trùng với phím tắt hệ thống; bạn cần kiểm tra cài đặt Keyboard trong System Preferences nếu
    phím tắt không hoạt động.
  sources:
  - Keyboard shortcuts in Word | Microsoft Support, https://support.microsoft.com/en-us/accessibility/word/keyboard-shortcuts-in-word

  fact: Bạn có thể nhấn tổ hợp phím Ctrl+F để nhanh chóng tìm kiếm một hàm trong bảng tài liệu.
  sources:
  - Excel functions (by category) | Microsoft Support, https://support.microsoft.com/en-us/excel/excel-functions-by-category

# Excel Knowledge Pack — task cards (SPEC §2 "Knowledge Pack", §6.4).
# Each card is a reviewed plan skeleton. Ribbon names/AutomationIds come from spikes/dump_ribbon.py on
# M365 build 20326 (EN UI). Items that only appear inside a menu/gallery are marked `unverified: true`
# until an eval run has grounded them. The Planner gets the best-matching cards as reference; when a
# card matches the question confidently the engine may use it directly (0 Planner calls).
version: 1
app: excel
cards:
  - id: pivot_basic
    title: Cách tạo PivotTable trong Excel
    keywords: [pivot, pivottable, bảng tổng hợp, bảng pivot, tổng hợp dữ liệu]
    fixture_id: sales_table_basic
    preconditions: [{type: select_range, ref: "A1:D21"}]
    steps:
      - {id: 1, intent: select_ribbon_tab, target: {names: [Insert, Chèn], control_type: TabItem, automation_id: TabInsert}, expected: {type: tab_selected}}
      - {id: 2, intent: invoke, target: {names: [PivotTable], control_type: Button|SplitButton, within: {names: [Tables, Bảng], control_type: Group}}, expected: {type: dialog_opened}, capture_result: true}
      - {id: 3, intent: invoke, target: {names: [OK], control_type: Button}, expected: {type: com_pivot_tables}, capture_result: true}
    success_check: {type: com_check, prop: book.pivot_tables, op: gte, value: 1}


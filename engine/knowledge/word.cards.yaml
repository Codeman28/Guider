# Word Knowledge Pack — task cards (SPEC §2 "Knowledge Pack", §6.4; Phase 4).
# Ribbon names/AutomationIds come from `spikes/dump_ribbon.py word` on M365 build 20326 (EN UI).
# Items inside a menu/gallery are `unverified: true` until an eval run has grounded them. Vietnamese
# names are unverified aliases (no VI-UI Office on the build machine yet). Fixture: word_report_basic
# (6 paragraphs: p1 title, p2 "Giới thiệu" (Heading 1), p3 body, p4 "Kết quả" (Heading 1), p5, p6 body).
# Table grid cells ('NxM Table') report disabled over UIA but act on Invoke → `allow_disabled: true`.
version: 1
app: word
cards:
  - id: word_bold
    title: Cách in đậm chữ trong Word
    keywords: [in đậm, chữ đậm, bôi đậm, bold, làm đậm chữ]
    fixture_id: word_report_basic
    preconditions: [{type: select_range, ref: "p2"}]
    steps:
      - {id: 1, intent: select_ribbon_tab, target: {names: [Home, Trang đầu], control_type: TabItem}, expected: {type: tab_selected}}
      - {id: 2, intent: invoke, target: {names: [Bold, Đậm], control_type: Button, automation_id: Bold, within: {names: [Font, Phông chữ], control_type: Group}}, expected: {type: com_check, prop: word.par.font.bold, ref: "2", op: "true"}, capture_result: true}
    success_check: {type: com_check, prop: word.par.font.bold, ref: "2", op: "true"}


      - {id: 2, intent: invoke, target: {names: [Text Highlight Color Yellow, Text Highlight Color], control_type: Button, within: {names: [Font, Phông chữ], control_type: Group}}, expected: {type: com_check, prop: word.par.highlight, ref: "5", op: gte, value: 1}, capture_result: true}
    success_check: {type: com_check, prop: word.par.highlight, ref: "5", op: gte, value: 1}

  - id: word_font_color_red
    title: Cách đổi màu chữ sang đỏ trong Word
    keywords: [màu chữ, đổi màu chữ, chữ màu đỏ, font color, tô màu chữ]
    fixture_id: word_report_basic
    preconditions: [{type: select_range, ref: "p2"}]
    steps:
      - {id: 1, intent: select_ribbon_tab, target: {names: [Home, Trang đầu], control_type: TabItem}, expected: {type: tab_selected}}
      - {id: 2, intent: invoke, target: {names: [Font Color Red, Font Color], control_type: Button, within: {names: [Font, Phông chữ], control_type: Group}}, expected: {type: com_check, prop: word.par.font.color, ref: "2", op: gte, value: 1}, capture_result: true}
    success_check: {type: com_check, prop: word.par.font.color, ref: "2", op: gte, value: 1}

  - id: word_landscape
    title: Cách xoay trang ngang trong Word
    keywords: [xoay ngang, trang ngang, landscape, đổi hướng trang, khổ ngang]
    fixture_id: word_report_basic
    steps:
      - {id: 1, intent: select_ribbon_tab, target: {names: [Layout, Bố cục], control_type: TabItem}, expected: {type: tab_selected}}
      - {id: 2, intent: expand, target: {names: [Orientation, Hướng], control_type: MenuItem, automation_id: PageOrientationGallery}, expected: {type: expanded}}
      - {id: 3, intent: select_item, target: {names: [Landscape, Ngang], control_type: ListItem|MenuItem|Button}, expected: {type: com_check, prop: word.page.orientation, op: eq, value: 1}, capture_result: true, unverified: true}
    success_check: {type: com_check, prop: word.page.orientation, op: eq, value: 1}

  - id: word_toc
    title: Cách chèn mục lục tự động trong Word
    keywords: [mục lục, mục lục tự động, table of contents, toc, tạo mục lục]
    fixture_id: word_report_basic
    preconditions: [{type: select_range, ref: "p1"}]
    steps:
      - {id: 1, intent: select_ribbon_tab, target: {names: [References, Tham chiếu], control_type: TabItem}, expected: {type: tab_selected}}
      - {id: 2, intent: expand, target: {names: [Table of Contents, Mục lục], control_type: MenuItem, automation_id: TableOfContentsGallery}, expected: {type: expanded}}
      - {id: 3, intent: select_item, target: {names: [Automatic Table 1, Bảng Tự động 1], control_type: ListItem|MenuItem|Button}, expected: {type: com_check, prop: word.toc, op: gte, value: 1}, capture_result: true, unverified: true}
    success_check: {type: com_check, prop: word.toc, op: gte, value: 1}

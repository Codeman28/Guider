    steps:
      - {id: 1, intent: select_ribbon_tab, target: {names: [Home, Trang đầu], control_type: TabItem}, expected: {type: tab_selected}}
      - {id: 2, intent: invoke, target: {names: [Bullets, Dấu đầu dòng], control_type: Button, within: {names: [Paragraph, Đoạn văn], control_type: Group}}, expected: {type: com_check, prop: word.par.list, ref: "3", op: gte, value: 1}, capture_result: true}
    success_check: {type: com_check, prop: word.par.list, ref: "3", op: gte, value: 1}


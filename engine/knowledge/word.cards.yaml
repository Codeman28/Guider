      - {id: 2, intent: invoke, target: {names: [Numbering, Đánh số], control_type: Button, within: {names: [Paragraph, Đoạn văn], control_type: Group}}, expected: {type: com_check, prop: word.par.list, ref: "3", op: gte, value: 1}, capture_result: true}
    success_check: {type: com_check, prop: word.par.list, ref: "3", op: gte, value: 1}

  - id: word_highlight
    title: Cách tô sáng (highlight) chữ trong Word
    keywords: [tô sáng, highlight, tô vàng, tô vàng chữ, đánh dấu chữ, bút dạ quang]
    fixture_id: word_report_basic
    preconditions: [{type: select_range, ref: "p5"}]
    steps:

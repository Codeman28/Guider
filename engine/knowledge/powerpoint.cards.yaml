    preconditions: [{type: select_range, ref: "s2.1"}]
    steps:
      - {id: 1, intent: select_ribbon_tab, target: {names: [Home, Trang đầu], control_type: TabItem}, expected: {type: tab_selected}}
      - {id: 2, intent: invoke, target: {names: [Bold, Đậm], control_type: Button, automation_id: Bold, within: {names: [Font, Phông chữ], control_type: Group}}, expected: {type: com_check, prop: ppt.shape.font.bold, ref: "2.1", op: "true"}, capture_result: true}
    success_check: {type: com_check, prop: ppt.shape.font.bold, ref: "2.1", op: "true"}


# PowerPoint Knowledge Pack — task cards (SPEC §2 "Knowledge Pack", §6.4; Phase 4).
# Ribbon names/AutomationIds come from `spikes/dump_ribbon.py powerpoint` on M365 build 20326 (EN UI).
# Gallery items are `unverified: true` until an eval run has grounded them; Vietnamese names are
# unverified aliases. Fixture: ppt_deck_basic (3 slides; slide 2 and 3 have title = shape 1,
# bulleted body = shape 2). PowerPoint is single-instance: Guider refuses while it is already open.
version: 1
app: powerpoint
cards:
  - id: ppt_new_slide
    title: Cách thêm trang chiếu mới trong PowerPoint
    keywords: [thêm slide, thêm trang, slide mới, new slide, chèn slide, thêm trang chiếu]
    fixture_id: ppt_deck_basic
    preconditions: [{type: select_range, ref: "s3"}]
    steps:
      - {id: 1, intent: select_ribbon_tab, target: {names: [Home, Trang đầu], control_type: TabItem}, expected: {type: tab_selected}}
      - {id: 2, intent: invoke, target: {names: [New Slide, Trang chiếu Mới], control_type: Button, within: {names: [Slides, Trang chiếu], control_type: Group}}, expected: {type: com_check, prop: ppt.slides, op: gte, value: 4}, capture_result: true}
    success_check: {type: com_check, prop: ppt.slides, op: gte, value: 4}

  - id: ppt_bold
    title: Cách in đậm chữ trong PowerPoint
    keywords: [in đậm, chữ đậm, bold, làm đậm chữ, bôi đậm]

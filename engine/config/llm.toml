# SPEC §7.2. Model IDs, endpoints and limits live here — never in code. Values were checked on
# 22–23/10/2026 against ollama.com/library; re-verify provider docs before changing them.

[default]
provider = "ollama"
# Chosen from spike S7 (docs/spikes/RESULTS.md): fastest on CPU (median 30 s), 100% schema-valid.
planner_model = "qwen3:1.7b"
writer_model = "qwen3:1.7b"
grounder_model = "qwen3:1.7b"
fallback = []            # e.g. ["openrouter"] — only providers with enabled = true are used

[ollama]
base_url = "http://127.0.0.1:11434"
timeout_s = 600          # CPU-only machines: S7 saw 10–280 s per Planner call
think = false            # qwen3 thinking mode off: faster, and output is constrained JSON anyway
keep_alive = "30m"      # S7: the runner got stuck in "Stopping..." when the model unloaded mid-run

[openrouter]             # optional, the user turns it on; payload is sanitized (§7.3)
enabled = false
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
models = []              # "<id>:free" entries — TODO(verify): https://openrouter.ai/models?q=free

[gemini]                 # optional (ADR-0003): the user picks it in Settings and pastes their own AI Studio key
enabled = false          # turned on by the app's choice (settings.json "provider"); key stored with DPAPI
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"  # checked 25/10/2026 on ai.google.dev/gemini-api/docs/openai
api_key_env = "GEMINI_API_KEY"   # optional developer override; the app uses secrets.bin
model = "gemini-3.5-flash-lite"  # stable, free tier (ai.google.dev/gemini-api/docs/models, 25/10/2026)
reasoning_effort = "low"         # Gemini 3 cannot turn thinking off; "low" keeps it short
timeout_s = 30

[training]               # developer-only training area (ADR-0004); reads books, links, research
cloud_model = "gemini-3.8-flash"   # stable, free tier (ai.google.dev/gemini-api/docs/models, 25/10/2026); used when a Gemini key is saved
local_model = "qwen3:4b"           # fallback without key: slower but far better than 1.7b at reading long text
chunk_chars_cloud = 12000
chunk_chars_local = 4000
max_pages = 20                     # per pasted link (same site, same folder)
local_timeout_s = 900
cloud_timeout_s = 120

[budget]
max_llm_calls_per_tutorial = 3
# Hard wall-clock limit from question to finished tutorial (always < 2 min).
# LLM calls get only what is left; on timeout the Planner takes the best card, the Writer the template.
max_seconds_per_tutorial = 110
planner_reserve_s = 60   # time kept back for the demonstration itself
